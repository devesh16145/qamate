<!doctype html><html><head><meta charset="utf-8"><title>Dispatch Desk — disposable QA app</title>
<style>body{font:17px system-ui;max-width:1000px;margin:32px auto;background:#f4f6fa;color:#172033}nav{display:flex;gap:24px;padding:16px;background:white}main{padding:24px;background:white;margin-top:20px}label{display:block;margin:16px 0}input,select,textarea,button{font:inherit;padding:8px;margin:4px}input,textarea{min-width:280px}button,a{cursor:pointer}section{padding:14px;border-bottom:1px solid #ddd}dialog{min-width:400px}output,[role=alert]{display:block;margin:12px 0;color:#8f1830}</style></head>
<body><h1>Dispatch Desk</h1><p>Disposable benchmark. Synthetic records only; browser-local state.</p>
<nav><a href="#/transfers">Transfers</a><a href="#/inventory">Inventory</a></nav><main></main>
<script>
const main=document.querySelector('main');
let records=JSON.parse(sessionStorage.getItem('transfers')||'[]');
let allocations=JSON.parse(sessionStorage.getItem('allocations')||'{}');
let inventoryPage=1;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){sessionStorage.setItem('transfers',JSON.stringify(records));sessionStorage.setItem('allocations',JSON.stringify(allocations));}
function transferList(){main.innerHTML=`<h2>Transfers</h2><a href="#/transfers/new">New transfer</a><label>Search transfers<input aria-label="Search transfers" type="search"></label><div id="rows"></div>`;
 const input=main.querySelector('input'); const draw=()=>{document.querySelector('#rows').innerHTML=records.filter(r=>r.name.includes(input.value)).map(r=>`<section><a href="#/transfers/${r.id}">${esc(r.name)}</a><span> ${esc(r.destination)} — ${esc(r.units)} units</span></section>`).join('')||'<p>No transfers found</p>';}; input.oninput=()=>setTimeout(draw,200);draw();}
function transferForm(){main.innerHTML=`<h2>New transfer</h2><form novalidate>
 <label>Transfer name<input name="transfer-name"></label>
 <label>Region<select name="region"><option value="">Choose region</option><option>North</option><option>South</option></select></label>
 <label>Destination<select name="destination" disabled><option value="">Choose destination</option></select></label>
 <label>Units<input name="units" type="number"></label>
 <label>Notes<textarea name="notes"></textarea></label>
 <p>Service: <span id="service">Standard</span></p><button type="button" id="choose-service">Choose service</button>
 <button type="submit">Save transfer</button><output role="alert"></output></form>`;
 const form=main.querySelector('form'),region=form.elements.region,destination=form.elements.destination;
 region.onchange=()=>{destination.disabled=!region.value;destination.innerHTML='<option value="">Choose destination</option>'+({North:['Jaipur','Delhi'],South:['Chennai','Kochi']}[region.value]||[]).map(x=>`<option>${x}</option>`).join('');};
 document.querySelector('#choose-service').onclick=()=>{const dialog=document.createElement('dialog');dialog.innerHTML='<h2>Service options</h2><button>Standard</button><button>Express</button><button>Cancel</button>';document.body.append(dialog);dialog.showModal();dialog.querySelectorAll('button').forEach(button=>button.onclick=()=>{if(button.textContent!=='Cancel')document.querySelector('#service').textContent=button.textContent;dialog.close();dialog.remove();});};
 form.onsubmit=e=>{e.preventDefault();const error=form.querySelector('output');const name=form.elements['transfer-name'].value.trim();
 if(!name){error.textContent='Transfer name is required';return;} if(!region.value||!destination.value){error.textContent='Region and destination are required';return;}
 if(!(Number(form.elements.units.value)>0)){error.textContent='Units must be greater than zero';return;}
 const record={id:String(records.length+1),name,region:region.value,destination:destination.value,units:form.elements.units.value,notes:form.elements.notes.value,service:document.querySelector('#service').textContent};
 form.querySelector('[type=submit]').disabled=true;error.textContent='Saving transfer…';setTimeout(()=>{records.push(record);persist();location.hash='/transfers/'+record.id;},650);};}
function transferDetail(id){const r=records.find(x=>x.id===id);main.innerHTML=r?`<h2>Transfer details</h2><h3>${esc(r.name)}</h3><p>Region: ${esc(r.region)}</p><p>Destination: ${esc(r.destination)}</p><p>Units: ${esc(r.units)}</p><p>Service: ${esc(r.service)}</p><p>Notes: ${esc(r.notes)}</p><p>Status: Scheduled</p><a href="#/transfers">Back to transfers</a>`:'<h2>Transfer not found</h2>';}
function inventory(){const start=(inventoryPage-1)*6+1;main.innerHTML=`<h2>Inventory</h2><p>Page ${inventoryPage} of 4</p>`+Array.from({length:6},(_,i)=>{const n=start+i;return `<section><a href="#/inventory/${n}">Batch ${String(n).padStart(3,'0')}</a><p>Warehouse ${n%2?'North':'South'}</p></section>`;}).join('')+`<button id="previous" ${inventoryPage===1?'disabled':''}>Previous page</button><button id="next" ${inventoryPage===4?'disabled':''}>Next page</button>`;
 main.querySelector('#previous').onclick=()=>{inventoryPage--;inventory();};main.querySelector('#next').onclick=()=>{inventoryPage++;inventory();};}
function inventoryDetail(id){const allocation=allocations[id];main.innerHTML=`<h2>Batch ${String(id).padStart(3,'0')}</h2><p>Product: Fertilizer</p><p>Warehouse ${id%2?'North':'South'}</p><p>Available units: ${id}</p><p id="allocation">${allocation?esc(`Allocated ${allocation.quantity} to ${allocation.customer} (${allocation.tier})`):'No allocation'}</p><button id="allocate">Allocate stock</button><a href="#/inventory">Back to inventory</a>`;
 document.querySelector('#allocate').onclick=()=>{const dialog=document.createElement('dialog');dialog.innerHTML='<h2>Stock allocation</h2><form novalidate><label>Customer<select name="customer"><option value="">Choose customer</option><option>CityGrow</option><option>RuralSeed</option></select></label><label>Tier<select name="tier" disabled><option value="">Choose tier</option></select></label><label>Quantity<input name="quantity" type="number"></label><button type="submit">Confirm allocation</button><button type="button" id="cancel">Cancel</button><output role="alert"></output></form>';document.body.append(dialog);dialog.showModal();const form=dialog.querySelector('form');form.elements.customer.onchange=()=>{form.elements.tier.disabled=false;form.elements.tier.innerHTML='<option value="">Choose tier</option>'+({CityGrow:['Standard','Priority'],RuralSeed:['Standard','Seasonal']}[form.elements.customer.value]||[]).map(x=>`<option>${x}</option>`).join('');};dialog.querySelector('#cancel').onclick=()=>{dialog.close();dialog.remove();};form.onsubmit=e=>{e.preventDefault();if(!form.elements.customer.value||!form.elements.tier.value||!(Number(form.elements.quantity.value)>0)){form.querySelector('output').textContent='Customer, tier and positive quantity are required';return;}form.querySelector('[type=submit]').disabled=true;setTimeout(()=>{allocations[id]={customer:form.elements.customer.value,tier:form.elements.tier.value,quantity:form.elements.quantity.value};persist();dialog.close();dialog.remove();inventoryDetail(id);},500);};};}
function render(){const path=location.hash.slice(1)||'/transfers';if(path==='/transfers')transferList();else if(path==='/transfers/new')transferForm();else if(path.startsWith('/transfers/'))transferDetail(path.split('/')[2]);else if(path==='/inventory')inventory();else if(path.startsWith('/inventory/'))inventoryDetail(Number(path.split('/')[2]));else main.textContent='Not found';}
window.onhashchange=render;render();
</script></body></html>
