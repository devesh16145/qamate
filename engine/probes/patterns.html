<!doctype html><meta charset="utf-8"><title>Ops console</title>
<style>.menu ul{display:none}.menu:hover ul{display:block}.toast{background:#dfd;padding:4px}</style>
<h1>Ops console</h1><main id="m"></main>
<script>
const P = new URLSearchParams(location.search).get('p') || 'home', m = document.getElementById('m');
const out = (t) => { let o = document.getElementById('out'); if (!o) { o = document.createElement('p'); o.id = 'out'; m.append(o); } o.textContent = t; };
const pages = {
  confirm: () => { m.innerHTML = '<button id="a">Archive report</button>'; a.onclick = () => out(confirm('Archive this report?') ? 'Report archived' : 'Archive cancelled'); },
  newtab: () => { m.innerHTML = '<a target="_blank" href="?p=report">Open report</a>'; },
  report: () => { m.innerHTML = '<h2>Quarterly report</h2><p>Revenue up 12%</p>'; },
  iframe: () => { m.innerHTML = '<h2>Embedded approval</h2><iframe title="Approval" width="400" height="120" srcdoc="<button onclick=&quot;document.getElementById(\'o\').textContent=\'Request approved\'&quot;>Approve request</button><p id=o>Waiting</p>"></iframe>'; },
  shadow: () => { class W extends HTMLElement { connectedCallback() { const r = this.attachShadow({mode: 'open'}); r.innerHTML = '<button>Refresh data</button><p>Stale data</p>'; r.querySelector('button').onclick = () => r.querySelector('p').textContent = 'Data refreshed'; } } customElements.define('ops-widget', W); m.innerHTML = '<ops-widget></ops-widget>'; },
  slow: () => { m.innerHTML = '<button id="g">Generate report</button>'; g.onclick = () => { out('Generating…'); setTimeout(() => out('Report ready'), 6500); }; },
  checkboxes: () => { m.innerHTML = '<h2>Alerts</h2><input type="checkbox"> Email alerts<br><input type="checkbox"> SMS alerts<br><button id="s">Save alerts</button>'; s.onclick = () => out('Saved: ' + [...m.querySelectorAll('input')].map(i => i.checked).join(',')); },
  select: () => { m.innerHTML = '<h3>Priority</h3><select id="s"><option>Low</option><option>Medium</option><option>High</option></select>'; s.onchange = () => out('Priority set to ' + s.value); },
  icons: () => { m.innerHTML = '<table><tr><td>Invoice 1041</td><td><button class="btn-icon icon-pencil" data-testid="edit-1041"><svg width="14" height="14"><rect width="14" height="14"/></svg></button><button class="btn-icon icon-download" data-testid="download-1041"><svg width="14" height="14"><circle cx="7" cy="7" r="6"/></svg></button></td></tr></table>'; m.querySelector('.icon-pencil').onclick = () => out('Editing invoice 1041'); },
  rows: () => { m.innerHTML = '<table><thead><tr><th>Name</th><th>Role</th><th></th></tr></thead><tbody>' + ['Smith|Admin', 'Bach|Viewer', 'Doe|Editor'].map(r => { const [n, role] = r.split('|'); return `<tr><td>${n}</td><td>${role}</td><td><a href="#" data-n="${n}">Edit</a> <a href="#" data-d="${n}">Disable</a></td></tr>`; }).join('') + '</tbody></table>'; m.onclick = (e) => { if (e.target.dataset.n) { e.preventDefault(); out('Editing ' + e.target.dataset.n); } }; },
  date: () => { m.innerHTML = '<label>Due date <input type="date" id="d"></label><button id="s">Set date</button>'; s.onclick = () => out('Due ' + d.value); },
  hover: () => { m.innerHTML = '<div class="menu"><button>Account</button><ul><li><a href="?p=report">Sign-in history</a></li></ul></div>'; },
  toastfast: () => { m.innerHTML = '<button id="s">Save settings</button>'; s.onclick = () => { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = 'Settings saved'; m.append(t); setTimeout(() => t.remove(), 1200); }; },
  toast: () => { m.innerHTML = '<button id="s">Save settings</button>'; s.onclick = () => { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = 'Settings saved'; m.append(t); setTimeout(() => t.remove(), 3500); }; },
  hindi: () => { m.innerHTML = '<label>ग्राहक का नाम <input id="n"></label><button id="s">नया ऑर्डर बनाएं</button><button>रद्द करें</button>'; s.onclick = () => out('ऑर्डर बन गया: ' + n.value); },
  french: () => { m.innerHTML = '<label>Nom du client <input id="n"></label><button id="s">Créer une commande</button><button>Annuler</button>'; s.onclick = () => out('Commande créée: ' + n.value); },
  rich: () => { m.innerHTML = '<div contenteditable="true" role="textbox" aria-label="Comment" style="border:1px solid #999;min-height:40px"></div><button id="s">Post comment</button>'; s.onclick = () => out('Posted: ' + m.querySelector('[contenteditable]').innerText); },
  longlist: () => { m.innerHTML = '<div id="l" style="height:300px;overflow:auto"></div>'; let n = 0; const more = () => { for (let i = 0; i < 25 && n < 200; i++) { n++; const a = document.createElement('a'); a.href = '#'; a.textContent = 'Ticket ' + n; a.style.display = 'block'; a.style.height = '24px'; a.onclick = (e) => { e.preventDefault(); out('Opened ' + a.textContent); }; l.append(a); } }; more(); l.onscroll = () => { if (l.scrollTop + l.clientHeight >= l.scrollHeight - 10) more(); }; },
  typeahead: () => { m.innerHTML = '<label>City <input id="c" autocomplete="off"></label><ul id="sg"></ul><button id="s">Save city</button>'; let chosen = ''; c.oninput = () => { chosen = ''; sg.innerHTML = ['Pune', 'Puri', 'Patna'].filter(x => c.value && x.toLowerCase().startsWith(c.value.toLowerCase())).map(x => `<li role="option">${x}</li>`).join(''); }; sg.onclick = (e) => { chosen = e.target.textContent; c.value = chosen; sg.innerHTML = ''; }; s.onclick = () => out(chosen ? 'City saved: ' + chosen : 'Choose a city from the list'); },
  records: () => { const data = [['Acme Rockets', 'Industrials'], ['Volt Grid', 'Energy'], ['Zen Power', 'Energy']];
    m.innerHTML = '<h2>Companies</h2><div><button>Industrials</button><button>Energy</button></div><label>Search <input type="search"></label><div id="rows"></div>';
    const input = m.querySelector('input'); const draw = () => { rows.innerHTML = data.filter(d => d[0].toLowerCase().includes(input.value.toLowerCase())).map(d => `<article><h3>${d[0]}</h3><p>${d[1]}</p></article>`).join('') || '<p>No companies found</p>'; };
    input.oninput = draw; draw(); },
  danger: () => { m.innerHTML = '<button id="c">Clean up</button>'; c.onclick = () => out(confirm('Delete all archived reports?') ? 'Archive emptied' : 'Archive kept'); },
  styled: () => { m.innerHTML = '<h4>Vendors:</h4>' + ['Apple', 'Samsung'].map(v => `<label style="display:block;position:relative"><input type="checkbox" value="${v}" style="opacity:0;position:absolute"><span class="checkmark" style="padding-left:20px">${v}</span></label>`).join('');
    m.onchange = () => out('Showing: ' + [...m.querySelectorAll('input:checked')].map(i => i.value).join(', ')); },
  segments: () => { m.innerHTML = '<label id="dl">Join date</label><div role="group" aria-labelledby="dl" style="border:1px solid #999;display:inline-block;padding:4px">' +
      [['Month', 'MM', 2], ['Day', 'DD', 2], ['Year', 'YYYY', 4]].map(([n, ph, len], i) => `<span role="spinbutton" aria-label="${n}" contenteditable="true" data-len="${len}" data-ph="${ph}" tabindex="${i ? -1 : 0}">${ph}</span>${i < 2 ? '<span>/</span>' : ''}`).join('') + '</div><button id="s">Save date</button>';
    const parts = [...m.querySelectorAll('[role=spinbutton]')];
    parts.forEach((part, i) => { part.addEventListener('focus', () => { const r = document.createRange(); r.selectNodeContents(part); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); });
      part.addEventListener('beforeinput', (e) => { e.preventDefault(); if (!/^\d$/.test(e.data || '')) return;
        const cur = /^\d+$/.test(part.textContent) && part.textContent.length < +part.dataset.len ? part.textContent : '';
        part.textContent = cur + e.data; if (part.textContent.length >= +part.dataset.len && parts[i + 1]) parts[i + 1].focus(); }); });
    s.onclick = () => out('Joined ' + parts.map(p => p.textContent).join('/')); },
  hiddenapp: () => { m.innerHTML = '<div aria-hidden="true"><label for="hn">Name</label><input id="hn"><button id="s"><fa-icon><svg aria-hidden="true" role="img" width="12" height="12"><rect width="12" height="12"/></svg></fa-icon>Create </button></div>';
    s.onclick = () => out('Created ' + hn.value); },
  placeholder: () => { m.innerHTML = '<div><label>Email</label><div><input placeholder="name@example.com" id="pe"></div></div><div><label>Age</label><div><input placeholder="Age" id="pa"></div></div><button id="s">Submit</button>';
    s.onclick = () => out('Submitted ' + pe.value + ' / ' + pa.value); },
  namesakes: () => { m.innerHTML = ['Galaxy S20', 'Galaxy S20+', 'Galaxy S20 Ultra'].map(n => `<div class="card"><p>${n}</p><div class="buy" style="cursor:pointer">Add to cart</div></div>`).join('');
    m.onclick = (e) => { if (e.target.className === 'buy') out('Added ' + e.target.previousElementSibling.textContent); }; },
  ticker: () => { m.innerHTML = '<button id="s">Save settings</button><span id="clock"></span>'; const tick = () => { clock.dataset.t = Date.now(); setTimeout(tick, 120); }; tick();
    setInterval(() => setTimeout(() => {}, 300), 150); s.onclick = () => setTimeout(() => out('Settings stored'), 400); },
  dup: () => { m.innerHTML = '<section aria-label="Billing address"><label>City <input></label><button>Save</button></section><section aria-label="Shipping address"><label>City <input></label><button>Save</button></section>'; m.querySelectorAll('button').forEach((b, i) => b.onclick = () => out((i ? 'Shipping' : 'Billing') + ' saved: ' + m.querySelectorAll('input')[i].value)); },
  uploadbtn: () => { m.innerHTML = '<h2>Attachments</h2><button id="b">Attach file</button><input type="file" id="f" hidden>'; b.onclick = () => f.click(); f.onchange = () => out('Attached ' + f.files[0].name); },
  uploadlabel: () => { m.innerHTML = '<h2>Documents</h2><label for="f" style="border:1px solid #999;padding:4px;cursor:pointer">Choose document</label><input type="file" id="f" style="display:none">'; f.onchange = () => out('Chosen ' + f.files[0].name); },
  download: () => { m.innerHTML = '<h2>Orders</h2><button id="e">Export CSV</button>'; e.onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['id,total\n1,20\n'], {type: 'text/csv'})); a.download = 'orders-' + new Date().toISOString().slice(0, 10) + '.csv'; document.body.append(a); a.click(); a.remove(); out('Export started'); }; },
  dragdrop: () => { m.innerHTML = '<div style="display:flex;gap:20px">' + [['To do', ['Fix login', 'Write docs']], ['Done', ['Ship v1']]].map(([name, cards]) => `<section aria-label="${name}" class="col" style="border:1px solid #999;width:200px;min-height:160px;padding:6px"><h3>${name}</h3>${cards.map(c => `<div class="card" draggable="true" style="border:1px solid #ccc;margin:4px;padding:6px">${c}</div>`).join('')}</section>`).join('') + '</div>';
    let held = null; m.addEventListener('dragstart', (e) => { held = e.target.closest('.card'); e.dataTransfer.setData('text/plain', held.textContent); });
    m.addEventListener('dragover', (e) => { if (e.target.closest('.col')) e.preventDefault(); });
    m.addEventListener('drop', (e) => { const col = e.target.closest('.col'); if (col && held) { e.preventDefault(); col.append(held); out('Moved ' + held.textContent + ' to ' + col.getAttribute('aria-label')); held = null; } }); },
  dragpointer: () => { m.innerHTML = '<div style="display:flex;gap:20px;user-select:none">' + [['Backlog', ['Audit logs', 'Dark mode']], ['In progress', ['Billing page']]].map(([name, cards]) => `<div class="col" data-name="${name}" style="border:1px solid #999;width:200px;min-height:160px;padding:6px"><h3>${name}</h3>${cards.map(c => `<div class="card" style="border:1px solid #ccc;margin:4px;padding:6px;touch-action:none">${c}</div>`).join('')}</div>`).join('') + '</div>';
    let held = null, start = null, moves = 0, active = false;
    m.addEventListener('pointerdown', (e) => { held = e.target.closest('.card'); start = [e.clientX, e.clientY]; moves = 0; active = false; });
    document.addEventListener('pointermove', (e) => { if (!held) return; moves++; if (moves >= 2 && Math.hypot(e.clientX - start[0], e.clientY - start[1]) > 8) { active = true; held.style.opacity = 0.5; } });
    document.addEventListener('pointerup', (e) => { if (held && active) { held.style.opacity = 1; const col = (document.elementFromPoint(e.clientX, e.clientY) || m).closest('.col'); if (col && col !== held.parentElement) { col.append(held); out('Moved ' + held.textContent + ' to ' + col.dataset.name); } } held = null; }); },
  contextmenu: () => { m.innerHTML = '<h2>Files</h2><ul><li class="file">budget.xlsx</li><li class="file">report.pdf</li></ul><div id="cm" role="menu" style="display:none;position:absolute;border:1px solid #999;background:#fff"></div>';
    let file = ''; m.addEventListener('contextmenu', (e) => { const li = e.target.closest('.file'); if (!li) return; e.preventDefault(); file = li.textContent; cm.innerHTML = '<div role="menuitem">Rename</div><div role="menuitem">Archive</div>'; cm.style.display = 'block'; cm.style.left = e.pageX + 'px'; cm.style.top = e.pageY + 'px'; });
    cm.onclick = (e) => { cm.style.display = 'none'; out(e.target.textContent + 'd ' + file); }; document.addEventListener('click', (e) => { if (!cm.contains(e.target)) cm.style.display = 'none'; }); },
  range: () => { m.innerHTML = '<label>Volume <input type="range" min="0" max="100" value="20" id="r"></label>'; r.oninput = () => out('Volume ' + r.value); },
  slider: () => { m.innerHTML = '<span id="bl">Brightness</span><div id="sl" role="slider" aria-labelledby="bl" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40" tabindex="0" style="width:200px;height:14px;background:#ddd"><div id="th" style="width:40%;height:14px;background:#369"></div></div>';
    const set = (v) => { v = Math.max(0, Math.min(100, v)); sl.setAttribute('aria-valuenow', v); th.style.width = v + '%'; out('Brightness ' + v); };
    sl.onkeydown = (e) => { const v = +sl.getAttribute('aria-valuenow'); const d = {ArrowRight: 5, ArrowUp: 5, ArrowLeft: -5, ArrowDown: -5, PageUp: 20, PageDown: -20}[e.key]; if (d) { e.preventDefault(); set(v + d); } else if (e.key === 'Home') { e.preventDefault(); set(0); } else if (e.key === 'End') { e.preventDefault(); set(100); } }; },
  frameform: () => { const other = location.origin.replace('127.0.0.1', 'localhost'); m.innerHTML = `<h2>Checkout</h2><iframe title="Secure payment" width="420" height="160" src="${other}/patterns.html?p=payform"></iframe>`; },
  payform: () => { document.querySelector('h1').remove(); m.innerHTML = '<label>Card holder <input id="h"></label><label>Plan <select id="pl"><option>Monthly</option><option>Yearly</option></select></label><button id="p">Pay now</button>'; p.onclick = () => out('Paid by ' + h.value + ' (' + pl.value + ')'); },
  frameeditor: () => { m.innerHTML = '<h2>Ticket</h2><label id="dl">Description</label><div class="tox"><iframe id="ed" title="Rich Text Area" width="400" height="100" srcdoc="<body contenteditable=&quot;true&quot; aria-label=&quot;Rich Text Area. Press ALT-0 for help.&quot;><p><br></p></body>"></iframe></div><button id="s">Save ticket</button>'; s.onclick = () => out('Saved: ' + ed.contentDocument.body.innerText.trim()); },
  editable: () => { m.innerHTML = '<h2>Discussion</h2><label>Comment</label><div class="ql-container"><div class="ql-editor ql-blank" contenteditable="true" data-placeholder="Write a comment..." style="border:1px solid #999;min-height:40px"></div></div><button id="s">Post</button>'; s.onclick = () => out('Posted: ' + m.querySelector('.ql-editor').innerText.trim()); },
  radio: () => { m.innerHTML = '<fieldset><legend>Shipping</legend><label><input type="radio" name="s" value="Standard" checked> Standard</label><label><input type="radio" name="s" value="Express"> Express</label></fieldset><fieldset><legend>Gift wrap</legend><label><input type="radio" name="g" value="No" checked> No</label><label><input type="radio" name="g" value="Yes"> Yes</label></fieldset>'; m.onchange = () => out('Shipping: ' + m.querySelector('[name=s]:checked').value + ', gift wrap: ' + m.querySelector('[name=g]:checked').value); },
  switch: () => { m.innerHTML = '<span id="dm">Dark mode</span> <button role="switch" aria-checked="false" aria-labelledby="dm" id="sw" style="width:40px">off</button>'; sw.onclick = () => { const on = sw.getAttribute('aria-checked') !== 'true'; sw.setAttribute('aria-checked', on); sw.textContent = on ? 'on' : 'off'; out('Dark mode ' + (on ? 'enabled' : 'disabled')); }; },
  multiselect: () => { m.innerHTML = '<label>Tags <select multiple id="t" size="4"><option>Urgent</option><option>Billing</option><option>Bug</option><option>Feature</option></select></label>'; t.onchange = () => out('Tags: ' + [...t.selectedOptions].map(o => o.value).join(', ')); },
  tabs: () => { m.innerHTML = '<div role="tablist"><button role="tab" aria-selected="true" id="t1">General</button><button role="tab" aria-selected="false" id="t2">Billing</button></div><div id="p1" role="tabpanel"><label>Display name <input></label></div><div id="p2" role="tabpanel" hidden><label>Tax ID <input id="tx"></label><button id="sb">Save billing</button></div>';
    t1.onclick = () => { p1.hidden = false; p2.hidden = true; t1.setAttribute('aria-selected', true); t2.setAttribute('aria-selected', false); }; t2.onclick = () => { p1.hidden = true; p2.hidden = false; t2.setAttribute('aria-selected', true); t1.setAttribute('aria-selected', false); }; sb.onclick = () => out('Billing saved: ' + tx.value); },
  accordion: () => { m.innerHTML = '<h2>Job settings</h2><details><summary>Advanced</summary><label>Timeout (s) <input id="to"></label><button id="ap">Apply</button></details>'; ap.onclick = () => out('Timeout set to ' + to.value); },
  inlineedit: () => { const rows = [['Smith', 'Admin'], ['Bach', 'Viewer'], ['Doe', 'Editor']]; m.innerHTML = '<table><thead><tr><th>Name</th><th>Role</th></tr></thead><tbody>' + rows.map(([n, r]) => `<tr><td>${n}</td><td class="ed">${r}</td></tr>`).join('') + '</tbody></table>';
    m.addEventListener('dblclick', (e) => { const td = e.target.closest('td.ed'); if (!td || td.querySelector('input')) return; const old = td.textContent; td.innerHTML = '<input>'; const i = td.firstChild; i.value = old; i.focus(); i.select();
      i.onkeydown = (k) => { if (k.key === 'Enter') { const v = i.value; td.textContent = v; out('Role of ' + td.previousElementSibling.textContent + ' is now ' + v); } else if (k.key === 'Escape') td.textContent = old; }; }); },
  deadtext: () => { m.innerHTML = '<h2>Reports</h2><p>Nothing here reacts to a click.</p><div id="q">Quarterly summary</div>'; q.onclick = () => out('Opened the quarterly summary'); },
  lazytabs: () => { const panels = { General: '<label>Display name <input></label>', Billing: '<label>Tax ID <input id="tx"></label><label>Notes <input></label><button id="sb">Save billing</button>', Shipping: '<label>Notes <input></label>' };
    m.innerHTML = '<div role="tablist">' + Object.keys(panels).map((n, i) => `<button role="tab" aria-selected="${!i}">${n}</button>`).join('') + '</div><div id="panel" role="tabpanel"></div>';
    const open = (name) => { panel.innerHTML = panels[name]; m.querySelectorAll('[role=tab]').forEach((t) => t.setAttribute('aria-selected', t.textContent === name)); const b = document.getElementById('sb'); if (b) b.onclick = () => out('Billing saved: ' + tx.value); };
    m.querySelectorAll('[role=tab]').forEach((t) => t.onclick = () => open(t.textContent)); open('General'); },
};
(pages[P] || (() => { m.innerHTML = Object.keys(pages).map(k => `<a href="?p=${k}">${k}</a>`).join(' '); }))();
</script>
