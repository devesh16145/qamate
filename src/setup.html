<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Setting up QAmate</title>
<style>
  :root { --bg: #0B1220; --panel: #111a2e; --border: #1f2a44; --text: #e5e9f2; --muted: #8a96b2; --accent: #3b82f6; --pass: #22c55e; --fail: #f87171; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; padding: 28px 32px 22px; -webkit-app-region: drag; user-select: none; }
  button, .log { -webkit-app-region: no-drag; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 40px; height: 40px; }
  .brand h1 { font-size: 17px; font-weight: 600; margin: 0; }
  .brand p { margin: 0; color: var(--muted); font-size: 12px; }
  .step { margin-top: 28px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .step-label { font-weight: 500; }
  .step-count { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .bar { margin-top: 10px; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .bar > div { height: 100%; width: 4%; background: var(--accent); border-radius: 3px; transition: width .4s ease; }
  .bar.indeterminate > div { width: 30%; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  .hint { margin-top: 10px; color: var(--muted); font-size: 12px; min-height: 18px; }
  .log { margin-top: 16px; flex: 1; min-height: 0; overflow-y: auto; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font: 11px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--muted);
    white-space: pre-wrap; word-break: break-all; user-select: text; }
  .foot { margin-top: 14px; display: flex; align-items: center; gap: 10px; min-height: 30px; }
  .msg { flex: 1; font-size: 12.5px; }
  .msg.ok { color: var(--pass); }
  .msg.fail { color: var(--fail); }
  button { display: none; height: 30px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel);
    color: var(--text); font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <div class="brand">
    <img src="../assets/branding/qamate-mark.svg" alt="">
    <div>
      <h1>Setting up QAmate</h1>
      <p>First launch only — preparing the Python test engine and browser.</p>
    </div>
  </div>

  <div class="step">
    <span class="step-label" id="label">Getting ready…</span>
    <span class="step-count" id="count"></span>
  </div>
  <div class="bar indeterminate" id="bar"><div></div></div>
  <div class="hint" id="hint">This takes a few minutes and needs an internet connection.</div>

  <div class="log" id="log"></div>

  <div class="foot">
    <span class="msg" id="msg"></span>
    <button id="close" onclick="window.close()">Continue to QAmate</button>
  </div>

<script>
  // Driven by bootstrap.js via executeJavaScript: qamateStep / qamateLog / qamateDone / qamateFail.
  const $ = (id) => document.getElementById(id);
  const MAX_LINES = 400;
  window.qamateLog = (line) => {
    const log = $('log');
    const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
    log.textContent += String(line) + '\n';
    const lines = log.textContent.split('\n');
    if (lines.length > MAX_LINES) log.textContent = lines.slice(-MAX_LINES).join('\n');
    if (atBottom) log.scrollTop = log.scrollHeight;
  };
  window.qamateStep = (i, total, label, detail) => {
    $('label').textContent = label;
    $('count').textContent = `Step ${i + 1} of ${total}`;
    const bar = $('bar');
    bar.classList.remove('indeterminate');
    bar.firstElementChild.style.width = Math.max(4, Math.round(((i + 0.5) / total) * 100)) + '%';
    $('hint').textContent = detail || (i === 2 ? 'Downloading packages — the longest step.' : i === 3 ? 'Downloading Chromium (about 150 MB).' : '');
  };
  window.qamateDone = () => {
    $('bar').classList.remove('indeterminate');
    $('bar').firstElementChild.style.width = '100%';
    $('label').textContent = 'Ready';
    $('hint').textContent = '';
    $('msg').className = 'msg ok';
    $('msg').textContent = 'Setup complete — opening QAmate…';
  };
  window.qamateFail = (message) => {
    $('bar').classList.remove('indeterminate');
    $('bar').firstElementChild.style.background = 'var(--fail)';
    $('label').textContent = 'Setup could not finish';
    $('hint').textContent = '';
    $('msg').className = 'msg fail';
    $('msg').textContent = message;
    $('close').style.display = 'inline-block';
  };
</script>
</body>
</html>
