function TestExplorer(props) {
  const {
    modules, allCount, failingCount, newCount, pinnedCount,
    checked, checkedCount, pinned, activeTcId, openTab,
    runStatus, openModules, toggleModule, toggleCheck, togglePin,
    selectModule, clearChecked, checkAll,
    search, setSearch, filter, setFilter,
    running, runSingle, onClose, toast,
    onRun, onStop, runProgress,
    seller, setSeller, admin, setAdmin,
    execMode, setExecMode, headless, setHeadless,
    expandedTcs, toggleExpandTc,
    checkedVersions, toggleCheckVersion,
  } = props;
  const showing = modules.reduce((s, m) => s + m.tests.length, 0);
  const [filterOpen, setFilterOpen] = useState(false);
  const filterRef = useRef(null);
  useEffect(() => {
    const h = (e) => { if (filterRef.current && !filterRef.current.contains(e.target)) setFilterOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  const filterOpts = [
    { id: 'all', label: 'All', count: allCount },
    { id: 'selected', label: 'Selected', count: checkedCount },
    { id: 'failing', label: 'Failing', count: failingCount, danger: true },
    { id: 'pinned', label: 'Pinned', count: pinnedCount },
    { id: 'new', label: 'New', count: newCount },
  ];
  const activeFilter = filterOpts.find(f => f.id === filter) || filterOpts[0];

  const sellerObj = USERS.find(u => u.id === seller) || USERS[0];
  const adminObj = ADMINS.find(a => a.id === admin) || ADMINS[0];
  const pct = runProgress && runProgress.total ? Math.round((runProgress.done / runProgress.total) * 100) : 0;

  return (
    <aside className="tw left">
      {/* Run toolbar — icon-only, tooltip on hover */}
      <div className="tx-runbar">
        {!running ? (
          <button className="tx-run-btn" onClick={onRun} disabled={checkedCount === 0} title={checkedCount ? `Run ${checkedCount} selected (⌘↵)` : 'Select tests to run'}>
            <I.Play size={13} />
            <span>Run{checkedCount > 0 ? ` ${checkedCount}` : ''}</span>
          </button>
        ) : (
          <button className="tx-run-btn stop" onClick={onStop} title="Stop run">
            <I.Stop size={13} />
            <span>Stop {runProgress.done}/{runProgress.total}</span>
          </button>
        )}
        <button className="tx-ic" title="Debug selected"><I.Bug size={14} /></button>
        <div className="tx-divider"></div>
        <Dropdown
          triggerClass="tx-ic"
          renderTrigger={() => <I.User size={14} />}
          options={USERS}
          onChange={setSeller}
          title={`Seller · ${sellerObj.name}`}
        />
        <Dropdown
          triggerClass="tx-ic"
          renderTrigger={() => <I.Shield size={14} />}
          options={ADMINS}
          onChange={setAdmin}
          title={`Admin · ${adminObj.name}`}
        />
        <div className="tx-divider"></div>
        <Dropdown
          triggerClass="tx-ic"
          renderTrigger={() => <I.Zap size={14} />}
          options={[{ id: 'sequential', name: 'Sequential · 1 session' }, { id: 'parallel', name: 'Parallel · 4 workers' }]}
          onChange={setExecMode}
          title={`Mode · ${execMode === 'parallel' ? 'Parallel · 4' : 'Sequential'}`}
        />
        <button className="tx-ic" onClick={() => setHeadless(h => !h)} title={headless ? 'Headless · click for headed' : 'Headed · click for headless'}>
          {headless ? <I.EyeOff size={14} /> : <I.Eye size={14} />}
        </button>
        <div style={{ flex: 1 }}></div>
        <button className="tx-ic" title="Hide panel" onClick={onClose}><I.X size={14} /></button>
      </div>
      {running && (
        <div className="tx-progress"><div className="fill" style={{ width: `${pct}%` }}></div></div>
      )}

      <div className="tw-header">
        <div className="tw-search">
          <I.Search size={13} style={{ color: 'var(--text-3)', flexShrink: 0 }} />
          <input
            value={search}
            onChange={e => setSearch(e.target.value)}
            placeholder={`Search ${allCount} tests…`}
          />
          {search && (
            <button
              onClick={() => setSearch('')}
              style={{ background: 'transparent', border: 'none', cursor: 'pointer', color: 'var(--text-3)', display: 'grid', placeItems: 'center', padding: 2 }}
              title="Clear"
            >
              <I.X size={12} />
            </button>
          )}
          <div ref={filterRef} style={{ position: 'relative' }}>
            <button
              className={`filter-pill${filter !== 'all' ? ' active' : ''}${activeFilter.danger && filter !== 'all' ? ' fail' : ''}`}
              onClick={() => setFilterOpen(o => !o)}
            >
              <span>{activeFilter.label}</span>
              <span className="ct">{activeFilter.count}</span>
              <I.ChevronDown size={10} className="caret" />
            </button>
            {filterOpen && (
              <div className="dd-menu" style={{ minWidth: 160, top: 'calc(100% + 6px)', right: 0, left: 'auto' }}>
                {filterOpts.map(opt => (
                  <button key={opt.id} onClick={() => { setFilter(opt.id); setFilterOpen(false); }}
                    style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 }}>
                    <span style={{ color: opt.danger && opt.count > 0 ? 'var(--fail)' : 'var(--text)' }}>{opt.label}</span>
                    <span style={{ fontFamily: 'var(--mono)', fontSize: 10.5, color: 'var(--text-3)' }}>{opt.count}</span>
                  </button>
                ))}
              </div>
            )}
          </div>
        </div>
        <button className="ic" title="New test case" onClick={() => toast && toast('New test case')}><I.Plus size={15} /></button>
      </div>

      {checkedCount > 0 && (
        <div className="sel-bar">
          <span><strong>{checkedCount}</strong> selected</span>
          <div className="acts">
            <button onClick={checkAll}>All</button>
            <button onClick={clearChecked}>Clear</button>
          </div>
        </div>
      )}

      <div className="tw-body">
        <div className="tree">
          {modules.length === 0 && (
            <div style={{ padding: '20px 12px', textAlign: 'center', color: 'var(--text-3)', fontSize: 11.5 }}>
              No test cases match.
            </div>
          )}
          {modules.map(m => {
            const isOpen = openModules.has(m.id);
            const Icon = I[m.icon] || I.Folder;
            const modChecked = m.tests.filter(t => checked.has(t.id)).length;
            return (
              <div className="module" key={m.id}>
                <div className="mod-head" onClick={() => toggleModule(m.id)}>
                  <span className={`mod-caret${isOpen ? ' open' : ''}`}><I.ChevronRight size={10} /></span>
                  <span className="mod-icon">{isOpen ? <I.FolderOpen size={13} /> : <Icon size={13} />}</span>
                  <span className="mod-name">{m.name}</span>
                  <span className="mod-count">
                    {modChecked > 0 ? `${modChecked}/${m.tests.length}` : m.tests.length}
                  </span>
                  <span className="mod-quick" onClick={e => e.stopPropagation()}>
                    <button onClick={() => selectModule(m, true)}>all</button>
                    <button onClick={() => selectModule(m, false)}>none</button>
                  </span>
                </div>
                {isOpen && (
                  <div className="tc-list">
                    {m.tests.map(t => {
                      const isExpanded = expandedTcs && expandedTcs.has(t.id);
                      const versions = t.versions || [];
                      return (
                        <React.Fragment key={t.id}>
                          <TestRow
                            tc={{ ...t, module: m }}
                            checked={checked.has(t.id)}
                            pinned={pinned.has(t.id)}
                            active={activeTcId === t.id}
                            runStatus={runStatus[t.id]}
                            onCheck={() => toggleCheck(t.id)}
                            onPin={() => togglePin(t.id)}
                            onSelect={() => openTab(t.id, t.hasData ? 'data' : 'story')}
                            onRun={() => runSingle(t.id)}
                            running={running}
                            versionCount={versions.length > 1 ? versions.length : 0}
                            expanded={isExpanded}
                            onToggleExpand={() => toggleExpandTc(t.id)}
                          />
                          {isExpanded && versions.length > 1 && versions.map(v => (
                            <TestRow
                              key={v.id}
                              tc={v}
                              isVersion={true}
                              checkedVersions={checkedVersions}
                              onCheckVersion={toggleCheckVersion}
                              activeVersionId={activeTcId}
                              onSelectVersion={(id) => openTab(id, 'data')}
                              runStatus={runStatus[t.id]}
                              onRun={() => runSingle(t.id)}
                              running={running}
                            />
                          ))}
                        </React.Fragment>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </aside>
  );
}

function TestRow({ tc, checked, pinned, active, runStatus, onCheck, onPin, onSelect, onRun, running, expanded, onToggleExpand, versionCount, isVersion, activeVersionId, onSelectVersion, onCheckVersion, checkedVersions }) {
  const [menuOpen, setMenuOpen] = useState(false);
  const menuRef = useRef(null);

  useEffect(() => {
    const h = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  const status = runStatus || tc.lastStatus;
  const isFlaky = (tc.tags || []).includes('flaky');
  const stClass = status === 'running' ? 'running' : (isFlaky ? 'flaky' : status);
  const stLabel = status === 'running' ? '··'
    : (isFlaky ? 'FLAKY' : ({ pass: 'PASS', fail: 'FAIL', skip: 'SKIP', never: '—' }[status] || '—'));
  if (isVersion) {
    // Version row (child of a parent test case)
    const checkedV = checkedVersions && checkedVersions.has(tc.id);
    return (
      <div className={`tc-row version${activeVersionId === tc.id ? ' active' : ''}`} onClick={() => onSelectVersion(tc.id)}>
        <div className="ver-rail"></div>
        <div className={`tc-check${checkedV ? ' checked' : ''}`} onClick={e => { e.stopPropagation(); onCheckVersion(tc.id); }}>
          {checkedV && <I.Check size={9} stroke={3} />}
        </div>
        <div className={`tc-status-label ${stClass}`} title={status}>{stLabel}</div>
        <div className="tc-body">
          <div className="tc-line1">
            <span className={`ver-kind ${tc.kind}`}>{tc.kind === 'negative' ? '−' : '+'}</span>
            <span className="tc-title">{tc.label}</span>
            {(tc.tags || []).map(t => (
              <span key={t} className={`tc-tag ${t === 'flaky' ? 'flaky' : t === 'new' ? 'new' : ''}`}>{t}</span>
            ))}
            {tc.lastDuration && tc.lastDuration !== '—' && <span className="tc-dur">{tc.lastDuration}</span>}
          </div>
        </div>
        <div className="tc-quick" onClick={e => e.stopPropagation()}>
          <button onClick={onRun} title="Run this version" disabled={running}>
            <I.Play size={10} />
          </button>
        </div>
      </div>
    );
  }
  return (
    <div className={`tc-row${active ? ' active' : ''}${versionCount > 0 ? ' has-versions' : ''}`} onClick={onSelect}>
      <button
        className={`tc-expand ${expanded ? 'open' : ''}`}
        onClick={e => { e.stopPropagation(); if (versionCount > 0) onToggleExpand(); }}
        title={versionCount > 0 ? (expanded ? 'Collapse versions' : 'Expand versions') : ''}
        style={{ visibility: versionCount > 0 ? 'visible' : 'hidden' }}
      >
        <I.ChevronRight size={10} />
      </button>
      <div className={`tc-check${checked ? ' checked' : ''}`} onClick={e => { e.stopPropagation(); onCheck(); }}>
        {checked && <I.Check size={9} stroke={3} />}
      </div>
      <div className={`tc-status-label ${stClass}`} title={status}>{stLabel}</div>
      <div className="tc-body">
        <div className="tc-line1">
          <span className="tc-id">{tc.id}</span>
          <span className="tc-title">{tc.title}</span>
          {versionCount > 0 && (
            <span className="ver-count" title={`${versionCount} versions`}>×{versionCount}</span>
          )}
          {(tc.tags || []).includes('new') && <span className="tc-tag new">new</span>}
          {tc.lastDuration && tc.lastDuration !== '—' && <span className="tc-dur">{tc.lastDuration}</span>}
        </div>
      </div>
      <div className="tc-quick" onClick={e => e.stopPropagation()}>
        <button className={`tc-pin${pinned ? ' pinned' : ''}`} onClick={onPin} title={pinned ? 'Unpin' : 'Pin'}>
          <I.Pin size={10} />
        </button>
        <button onClick={onRun} title="Run only this" disabled={running}>
          <I.Play size={10} />
        </button>
        <div ref={menuRef} style={{ position: 'relative', display: 'inline-block' }}>
          <button title="More" onClick={() => setMenuOpen(o => !o)}>
            <I.MoreHorizontal size={12} />
          </button>
          {menuOpen && (
            <div className="tc-actions-menu" style={{ right: 0, left: 'auto', top: '100%', minWidth: 160 }}>
              <button onClick={() => { setMenuOpen(false); onSelect(); }}>
                <I.FileText size={12} />
                <span>View Details</span>
              </button>
              <button onClick={() => { setMenuOpen(false); window.openReviewTab(tc.id, tc.module ? tc.module.id : 'po', tc.title || tc.description, { editMode: true }); }}>
                <I.Edit size={12} />
                <span>Edit Test</span>
              </button>
              <button onClick={() => { setMenuOpen(false); window.setModalState({ isOpen: true, type: 'record', tcId: tc.id, flowId: tc.module ? tc.module.id : 'po', description: tc.title || tc.description }); }}>
                <I.Record size={12} />
                <span>Re-record</span>
              </button>
              <button onClick={() => { setMenuOpen(false); window.openCoverageTab(tc.id, tc.module ? tc.module.id : 'po', tc.title || tc.description); }}>
                <I.BarChart size={12} />
                <span>Analyze Coverage</span>
              </button>
              <button onClick={() => { setMenuOpen(false); window.openJiraTab(tc.id, tc.module ? tc.module.id : 'po', tc.title || tc.description, 'Story'); }}>
                <I.Bug size={12} />
                <span>Jira Story</span>
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ──────────────────────────────────────────────────────────────
   Status Bar
   ────────────────────────────────────────────────────────────── */
function StatusBar({ activeTc, env, execMode, headless, running, runProgress, checkedCount, onOpenShortcuts }) {
  const crumbs = activeTc
    ? [activeTc.module.name, activeTc.id]
    : ['Live Log'];
  return (
    <div className="statusbar">
      <div className="breadcrumb">
        {crumbs.map((c, i) => (
          <React.Fragment key={i}>
            {i > 0 && <I.ChevronRight size={9} className="sep" />}
            <span className={`seg${i === crumbs.length - 1 ? ' curr' : ''}`}>{c}</span>
          </React.Fragment>
        ))}
      </div>
      <div className="status-spacer"></div>
      {running ? (
        <span className="status-item live">
          <span className="dot"></span>
          Running {runProgress.done + 1}/{runProgress.total}
        </span>
      ) : checkedCount > 0 ? (
        <span className="status-item" style={{ color: 'var(--text-2)' }}>
          {checkedCount} selected · ready
        </span>
      ) : (
        <span className="status-item">
          <I.Check size={11} className="ic" /> Ready
        </span>
      )}
      <div className="status-divider"></div>
      <button className="status-item" onClick={onOpenShortcuts} title="Keyboard shortcuts (?)">
        <I.Keyboard size={11} className="ic" />
      </button>
    </div>
  );
}

window.App = App;
window.nowTs = nowTs;

/* EditorArea, RightToolWindow, overlays, bootstrap */

/* ──────────────────────────────────────────────────────────────
   Editor Area — tabs + content
   ────────────────────────────────────────────────────────────── */
function EditorArea({ tabs, activeTab, setActiveTab, closeTab, setTabView, logLines, running, execMode, headless, runProgress, onOpenCmd, onRun, runSingle, drawerH, setDrawerH, onClearLog, openResultsTab, toast, checkedCount, history, trend, onCreateBug, openTab, openCoverageTab, openReviewTab }) {
  const active = tabs.find(t => t.id === activeTab) || tabs[0];
  const activeTcId = active && active.kind === 'tc' ? active.id : null;
  const tcRuns = (history || []).filter(h => activeTcId ? (h.tcs || []).includes(activeTcId) : true);

  // Bottom drawer (Live Log / History): elapsed timer, auto-scroll, and a draggable divider
  const logRef = useRef(null);
  const logScrollRef = useRef(null);
  const [elapsed, setElapsed] = useState(0);
  const [drawerTab, setDrawerTab] = useState('log');  // 'log' | 'history'
  useEffect(() => {
    if (!running) return;
    setDrawerTab('log');               // jump to the log when a run starts
    const t0 = Date.now(); setElapsed(0);
    const iv = setInterval(() => setElapsed((Date.now() - t0) / 1000), 200);
    return () => clearInterval(iv);
  }, [running]);
  useEffect(() => {
    if (logScrollRef.current) logScrollRef.current.scrollTop = logScrollRef.current.scrollHeight;
  }, [logLines]);
  const startDrawerResize = (e) => {
    e.preventDefault();
    const startY = e.clientY, startH = drawerH || 0;
    let cur = startH;
    const onMove = (ev) => {
      cur = Math.max(0, Math.min(startH + (startY - ev.clientY), window.innerHeight * 0.6));
      if (logRef.current) logRef.current.style.height = cur + 'px';
    };
    const onUp = () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      document.body.classList.remove('resizing-v');
      setDrawerH(cur);
    };
    document.body.classList.add('resizing-v');
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  };

  return (
    <section className="editor-area">
      <div className="tab-bar">
        {tabs.map(t => {
          const isActive = t.id === activeTab;
          if (t.kind === 'log') {
            return (
              <div key={t.id} className={`tab${isActive ? ' active' : ''}`} onClick={() => setActiveTab(t.id)}>
                <I.Activity size={12} className="ic" />
                <span>Live Log</span>
                {running && <span className="live-dot"></span>}
              </div>
            );
          }
          if (t.kind === 'results') {
            const run = t.runId ? window.HISTORY.find(h => h.id === t.runId) : null;
            const label = t.runId
              ? (run ? `Run ${run.when.slice(11)}` : `Run ${t.runId}`)
              : 'Latest run';
            const failed = run && run.failed > 0;
            return (
              <div key={t.id} className={`tab${isActive ? ' active' : ''}`} onClick={() => setActiveTab(t.id)}>
                <span className={`status-dot ${run ? run.status : 'pass'}`}></span>
                <I.BarChart size={12} className="ic" />
                <span>{label}</span>
                <button className="close" onClick={(e) => { e.stopPropagation(); closeTab(t.id); }}>
                  <I.X size={10} />
                </button>
              </div>
            );
          }
          if (t.kind === 'coverage') {
            return (
              <div key={t.id} className={`tab${isActive ? ' active' : ''}`} onClick={() => setActiveTab(t.id)}>
                <I.BarChart size={12} className="ic" style={{ color: 'var(--accent)' }} />
                <span style={{ fontFamily: 'var(--mono)', fontSize: 11 }}>Coverage — {t.tcId}</span>
                <button className="close" onClick={(e) => { e.stopPropagation(); closeTab(t.id); }}>
                  <I.X size={10} />
                </button>
              </div>
            );
          }
          if (t.kind === 'review') {
            return (
              <div key={t.id} className={`tab${isActive ? ' active' : ''}`} onClick={() => setActiveTab(t.id)}>
                <I.Edit size={12} className="ic" style={{ color: 'var(--accent)' }} />
                <span style={{ fontFamily: 'var(--mono)', fontSize: 11 }}>{t.reviewData?.editMode ? 'Edit' : 'Review'} — {t.tcId}</span>
                <button className="close" onClick={(e) => { e.stopPropagation(); closeTab(t.id); }}>
                  <I.X size={10} />
                </button>
              </div>
            );
          }
          if (t.kind === 'jira') {
            return (
              <div key={t.id} className={`tab${isActive ? ' active' : ''}`} onClick={() => setActiveTab(t.id)}>
                <I.Bug size={12} className="ic" style={{ color: 'var(--accent)' }} />
                <span style={{ fontFamily: 'var(--mono)', fontSize: 11 }}>Jira — {t.tcId}</span>
                <button className="close" onClick={(e) => { e.stopPropagation(); closeTab(t.id); }}>
                  <I.X size={10} />
                </button>
              </div>
            );
          }
          const tc = MODULES.flatMap(m => m.tests).find(x => x.id === t.id);
          if (!tc) return null;
          return (
            <div key={t.id} className={`tab${isActive ? ' active' : ''}`} onClick={() => setActiveTab(t.id)}>
              <span className={`status-dot ${tc.lastStatus}`}></span>
              <I.FileText size={12} className="ic" />
              <span style={{ fontFamily: 'var(--mono)', fontSize: 11 }}>{tc.id}</span>
              <button className="close" onClick={(e) => { e.stopPropagation(); closeTab(t.id); }}>
                <I.X size={10} />
              </button>
            </div>
          );
        })}
        <div className="tab-spacer"></div>
        <div className="tab-tools">
          <button title="Recent tabs"><I.ChevronDown size={13} /></button>
          <button
            className="tab-run"
            title={active && active.kind === 'tc' ? 'Run this test' : 'Run selected'}
            disabled={running}
            onClick={() => { if (active && active.kind === 'tc') runSingle(active.id); else onRun(); }}
          >
            <I.Play size={12} /> Run
          </button>
        </div>
      </div>

      <div className="editor-body">
        {active && active.kind === 'log' && (
          <LogView logLines={logLines} running={running} execMode={execMode} headless={headless} onRun={onRun} onOpenCmd={onOpenCmd} checkedCount={checkedCount} />
        )}
        {active && active.kind === 'results' && (
          <ResultsView history={history} trend={trend} onCreateBug={onCreateBug} openTab={openTab} runId={active.runId} toast={toast} />
        )}
        {active && active.kind === 'tc' && (
          <TestCaseView tabId={active.id} view={active.view} setTabView={setTabView} toast={toast} openCoverageTab={openCoverageTab} openReviewTab={openReviewTab} />
        )}
        {active && active.kind === 'coverage' && (
          <CoverageModal tcId={active.tcId} flowId={active.flowId} description={active.description} onClose={() => closeTab(active.id)} toast={toast} isTab={true} />
        )}
        {active && active.kind === 'review' && (
          <ReviewModal tcId={active.tcId} flowId={active.flowId} description={active.description} onClose={() => closeTab(active.id)} toast={toast} reviewData={active.reviewData} isTab={true} />
        )}
        {active && active.kind === 'jira' && (
          <JiraModal tcId={active.tcId} flowId={active.flowId} description={active.description} initialType={active.jiraType} onClose={() => closeTab(active.id)} toast={toast} isTab={true} />
        )}
      </div>

      {/* Bottom drawer — Live Log + per-test History, faded draggable divider */}
      <div className="log-drawer">
        <div className="drawer-divider" onMouseDown={startDrawerResize} title="Drag to resize"></div>
        <div className="drawer-head">
          <div className="drawer-tabs">
            <button className={drawerTab === 'log' ? 'on' : ''} onClick={() => { setDrawerTab('log'); if (drawerH < 60) setDrawerH(240); }}>
              <span className={`dh-dot${running ? ' running' : ''}`}></span> Live Log
            </button>
            <button className={drawerTab === 'history' ? 'on' : ''} onClick={() => { setDrawerTab('history'); if (drawerH < 60) setDrawerH(240); }}>
              History{activeTcId && tcRuns.length > 0 ? <span className="dh-count">{tcRuns.length}</span> : null}
            </button>
          </div>
          {drawerTab === 'log' ? (
            <>
              <span className="dh-status">{running ? `Running ${runProgress.done}/${runProgress.total || 0}` : (logLines.length ? `${logLines.length} lines` : 'idle')}</span>
              {(running || elapsed > 0) && <span className="dh-time">{elapsed.toFixed(1)}s</span>}
              <span className="dh-meta">{execMode === 'parallel' ? 'Parallel' : 'Sequential'} · {headless ? 'Headless' : 'Headed'}</span>
            </>
          ) : (
            <span className="dh-status">{activeTcId ? activeTcId : 'all test cases'}</span>
          )}
          <div style={{ flex: 1 }}></div>
          {drawerTab === 'log' && <button className="dh-ic" title="Clear log" onClick={(e) => { e.stopPropagation(); onClearLog && onClearLog(); }}><I.Trash size={12} /></button>}
          <button className="dh-ic" title={drawerH > 60 ? 'Collapse' : 'Expand'} onClick={() => setDrawerH(h => h > 60 ? 0 : 240)}>
            <I.ChevronDown size={13} style={{ transform: drawerH > 60 ? 'none' : 'rotate(180deg)', transition: 'transform .15s' }} />
          </button>
        </div>
        <div className="drawer-body" ref={logRef} style={{ height: drawerH }}>
          {drawerTab === 'log' ? (
            logLines.length === 0 ? (
              <div className="drawer-empty">No output yet — run a test to see live logs here.</div>
            ) : (
              <div className="log-scroll" ref={logScrollRef}>
                {logLines.map((l, i) => (
                  <div className={`log-row ${l.type}`} key={i}>
                    <span className="log-time">{l.t}</span>
                    <span className="log-marker"></span>
                    <span className="log-text">{l.text}</span>
                  </div>
                ))}
              </div>
            )
          ) : (
            <div className="drawer-runs">
              {tcRuns.length === 0 ? (
                <div className="drawer-empty">{activeTcId ? 'No runs yet for this test case.' : 'No run history.'}</div>
              ) : tcRuns.map(h => (
                <button className="drawer-run" key={h.id} onClick={() => openResultsTab && openResultsTab(h.id)} title="Open this run">
                  <span className={`run-dot ${h.failed > 0 ? 'fail' : h.passed > 0 ? 'pass' : 'skip'}`}></span>
                  <span className="run-when">{h.when}</span>
                  <span className="run-stats"><b className="p">{h.passed}</b><span className="sep">·</span><b className="f">{h.failed}</b></span>
                  <span className="run-dur">{(h.duration || 0).toFixed(1)}s</span>
                </button>
              ))}
            </div>
          )}
        </div>
      </div>
    </section>
  );
}

function TestCaseView({ tabId, view, setTabView, toast, openCoverageTab, openReviewTab }) {
  const tc = useMemo(() => {
    for (const m of MODULES) {
      const t = m.tests.find(t => t.id === tabId);
      if (t) return { ...t, module: m };
      for (const t of m.tests) {
        const v = (t.versions || []).find(vv => vv.id === tabId);
        if (v) return { ...v, parent: t, module: m, isVersion: true, title: v.label, hasData: true, tags: [...(t.tags||[]), ...(v.tags||[])] };
      }
    }
    return null;
  }, [tabId]);

  const [menuOpen, setMenuOpen] = useState(false);
  const [renaming, setRenaming] = useState(false);
  const [renameVal, setRenameVal] = useState('');
  const [dsHost, setDsHost] = useState(null);   // portal slot in the sub-tab row for DataView's controls
  const menuRef = useRef(null);
  useEffect(() => {
    const h = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  if (!tc) return null;

  const flowId = tc.module.id;
  async function doDeleteTest() {
    if (!window.confirm(`Delete ${tc.id}? This removes it from test_cases.json and test_data.json.`)) return;
    const r = await window.ats.deleteTest({ flowId, tcId: tc.id });
    if (r && r.success) { toast('Test deleted'); setTimeout(() => window.location.reload(), 400); }
    else toast('Delete failed: ' + ((r && r.error) || 'unknown'));
  }
  async function commitRename() {
    const v = renameVal.trim();
    if (!v || v === tc.title) { setRenaming(false); return; }
    const r = await window.ats.saveTcMeta({ flowId, tcId: tc.id, heading: v, description: v });
    if (r && r.success) { toast('Saved'); setTimeout(() => window.location.reload(), 400); }
    else { toast('Save failed: ' + ((r && r.error) || 'unknown')); setRenaming(false); }
  }

  const views = [
    { id: 'data', label: 'Test Data', icon: 'FileText' },
    { id: 'story', label: 'User Story', icon: 'MessageSquare' },
    { id: 'steps', label: 'Steps', icon: 'GitMerge' },
  ];

  const menuItems = tc.isVersion ? [
    { id: 'data', label: 'Test Data', icon: 'FileText', onClick: () => setTabView(tabId, 'data') },
    { id: 'edit', label: 'Edit Steps', icon: 'Edit', onClick: () => setTabView(tabId, 'steps') },
    { id: 'rerecord', label: 'Re-record', icon: 'Record', onClick: () => window.setModalState({ isOpen: true, type: 'record', tcId: tc.id, flowId: tc.module.id, description: tc.title }) },
    { id: 'coverage', label: 'Analyze Coverage', icon: 'BarChart', onClick: () => openCoverageTab ? openCoverageTab(tc.id, tc.module.id, tc.title) : window.setModalState({ isOpen: true, type: 'coverage', tcId: tc.id, flowId: tc.module.id, description: tc.title }) },
    { id: 'jira', label: 'Jira Bug / Story', icon: 'Bug', onClick: () => window.openJiraTab(tc.id, tc.module.id, tc.title, 'Story') },
    { divider: true },
    { id: 'duplicate', label: 'Duplicate version…', icon: 'Copy', onClick: () => toast('Version duplicated') },
    { id: 'delete', label: 'Delete version', icon: 'Trash', danger: true, onClick: () => toast('Delete version?') },
  ] : [
    { id: 'data', label: 'Test Data', icon: 'FileText', onClick: () => setTabView(tabId, 'data') },
    { id: 'edit', label: 'Edit Test', icon: 'Edit', onClick: () => openReviewTab ? openReviewTab(tc.id, tc.module.id, tc.title, { editMode: true }) : window.setModalState({ isOpen: true, type: 'review', tcId: tc.id, flowId: tc.module.id, description: tc.title, reviewData: { editMode: true } }) },
    { id: 'rerecord', label: 'Re-record', icon: 'Record', onClick: () => window.setModalState({ isOpen: true, type: 'record', tcId: tc.id, flowId: tc.module.id, description: tc.title }) },
    { id: 'coverage', label: 'Analyze Coverage', icon: 'BarChart', onClick: () => openCoverageTab ? openCoverageTab(tc.id, tc.module.id, tc.title) : window.setModalState({ isOpen: true, type: 'coverage', tcId: tc.id, flowId: tc.module.id, description: tc.title }) },
    { id: 'jira', label: 'Jira Bug / Story', icon: 'Bug', onClick: () => window.openJiraTab(tc.id, tc.module.id, tc.title, 'Story') },
    { divider: true },
    { id: 'rename', label: 'Rename / edit description…', icon: 'Edit', onClick: () => { setRenameVal(tc.title); setRenaming(true); } },
    { id: 'newver', label: 'New version…', icon: 'Plus', onClick: () => toast('New version created') },
    { id: 'duplicate', label: 'Duplicate test', icon: 'Copy', onClick: () => toast('Test duplicated') },

  return (

        </div>

        <div className="ds-host" ref={setDsHost}></div>

        <div className="right-acts">
          <div ref={menuRef} style={{ position: 'relative' }}>
            <button className="ic-action" title="More" onClick={() => setMenuOpen(o => !o)}>
              <I.MoreHorizontal size={14} />

            {menuOpen && (
              <div className="tc-actions-menu">
                {menuItems.map((item, i) => {
                  if (item.divider) return <div className="div" key={`d${i}`}></div>;
                  const Icon = I[item.icon] || I.File;
                  return (
                    <button

      <div className="detail-body">
        <div className="tc-line">
          <span className={`tc-status-dot ${tc.lastStatus}`}></span>
          <span className="tc-id">{tc.id}</span>
          {(tc.tags || []).includes('flaky') && <span className="tc-tag" style={{ color: 'var(--warn)', background: 'var(--warn-bg)' }}>flaky</span>}
          {(tc.tags || []).includes('new') && <span className="tc-tag" style={{ color: 'var(--accent)', background: 'var(--accent-bg)' }}>new</span>}
          {(tc.tags || []).filter(t => t !== 'flaky' && t !== 'new').map(t => <span key={t} className="tc-tag">{t}</span>)}
          {renaming ? (
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>
              <input className="setting-input" autoFocus value={renameVal}
                onChange={e => setRenameVal(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') commitRename(); if (e.key === 'Escape') setRenaming(false); }}
                style={{ minWidth: 280 }} />
              <button className="ic-action" title="Save" onClick={commitRename}><I.Check size={13} /></button>
              <button className="ic-action" title="Cancel" onClick={() => setRenaming(false)}><I.X size={13} /></button>

          <JiraChips tcId={tc.id} flowId={tc.module.id} title={tc.title} />
        </div>
        {view === 'data' && tc.hasData && <DataView tc={tc} toast={toast} ctlHost={dsHost} />}
        {view === 'data' && !tc.hasData && (
          <div style={{ padding: 24, textAlign: 'center', color: 'var(--text-3)', fontSize: 12 }}>

function DataView({ tc, toast, ctlHost }) {
  const flowId = tc.module.id;
  // On a version tab, the synthetic tc.id is `${parentId}::${variant}`; resolve to the real TC id.
  const tcId = tc.isVersion && tc.parent ? tc.parent.id : tc.id;
  const lockedVariant = tc.isVersion ? (tc.dataset || null) : null;

  const [loading, setLoading] = useState(true);
  const [isVariantMode, setIsVariantMode] = useState(false);
  const [variants, setVariants] = useState({});      // name -> data object (variant mode)
  const [variantNames, setVariantNames] = useState([]);
  const [active, setActive] = useState(null);        // active variant name | null (flat)
  const [jsonStr, setJsonStr] = useState('{}');
  const [dirty, setDirty] = useState(false);
  const [namePrompt, setNamePrompt] = useState(null); // { mode:'new'|'dup'|'tpl', value }
  const [templates, setTemplates] = useState(null);   // null = picker closed, [] = open
  const [mode, setMode] = useState('table');          // 'table' | 'raw'  (table = friendly key/value)
  const [rows, setRows] = useState([]);               // [{ id, key, val, type }]  type: 'text' | 'json'
  const [moreOpen, setMoreOpen] = useState(false);    // variant/template overflow menu (keeps band 2 compact)
  const moreRef = useRef(null);
  const ridRef = useRef(0);
  useEffect(() => {
    const h = (e) => { if (moreRef.current && !moreRef.current.contains(e.target)) setMoreOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  let valid = true, parsed = null;
  try { parsed = JSON.parse(jsonStr); } catch (e) { valid = false; }

  // ── Postman-style key/value <-> object bridge (jsonStr stays the single source of truth) ──
  const isPlainObj = (o) => !!o && typeof o === 'object' && !Array.isArray(o);
  const canTable = isPlainObj(parsed);
  const fieldCount = canTable ? Object.keys(parsed).length : rows.length;
  const newRow = (key = '', val = '', type = 'text') => ({ id: ++ridRef.current, key, val, type });
  const objToRows = (obj) => isPlainObj(obj)
    ? Object.entries(obj).map(([k, v]) => typeof v === 'string' ? newRow(k, v, 'text') : newRow(k, JSON.stringify(v), 'json'))
    : [];
  const rowsToObj = (rs) => {
    const o = {};
    for (const r of rs) {
      const k = (r.key || '').trim();
      if (!k) continue;
      if (r.type === 'json') { try { o[k] = JSON.parse(r.val); } catch (e) { o[k] = r.val; } }
      else o[k] = r.val;
    }
    return o;
  };
  const rowValid = (r) => { if (r.type !== 'json') return true; try { JSON.parse(r.val); return true; } catch (e) { return false; } };
  const commitRows = (rs) => { setRows(rs); setJsonStr(JSON.stringify(rowsToObj(rs), null, 2)); setDirty(true); };
  const patchRow = (id, patch) => commitRows(rows.map(r => r.id === id ? { ...r, ...patch } : r));
  const addRow = () => commitRows([...rows, newRow()]);
  const delRow = (id) => { const next = rows.filter(r => r.id !== id); commitRows(next.length ? next : [newRow('', '', 'text')]); };
  const toggleRowType = (id) => { const r = rows.find(x => x.id === id); if (r) patchRow(id, { type: r.type === 'json' ? 'text' : 'json' }); };
  const goRaw = () => setMode('raw');
  const goTable = () => {
    // Only rebuild the table when the raw JSON was actually changed; otherwise keep the
    // existing rows as-is so switching Raw<->Table never resets the table (or loses focus).
    if (valid) {
      const changed = JSON.stringify(rowsToObj(rows)) !== JSON.stringify(parsed);
      if (changed) { const r = objToRows(parsed || {}); setRows(r.length ? r : [newRow('', '', 'text')]); }
    }
    setMode('table');
  };
  const formatJson = () => { if (valid) setJsonStr(JSON.stringify(parsed, null, 2)); };

  const reload = useCallback(async () => {
    setLoading(true);
    const res = await window.ats.getTcData({ flowId, tcId });
    if (res && res.isVariant) {
      const names = Object.keys(res.variants);
      const a = lockedVariant && names.includes(lockedVariant) ? lockedVariant : (names[0] || null);
      setIsVariantMode(true);
      setVariants(res.variants);
      setVariantNames(names);
      setActive(a);
      setJsonStr(JSON.stringify(a ? res.variants[a] : {}, null, 2));
    } else {
      setIsVariantMode(false);
      setVariants({});
      setVariantNames([]);
      setActive(lockedVariant);
      setJsonStr(JSON.stringify((res && res.data) || {}, null, 2));
    }
    setDirty(false);
    setLoading(false);
  }, [flowId, tcId, lockedVariant]);

  useEffect(() => { reload(); }, [reload]);

  // Re-derive the key/value table whenever the data SOURCE changes (variant switch, reload, template),
  // but NOT on table keystrokes (those only mutate jsonStr, leaving these deps untouched).
  useEffect(() => {
    let obj = {}; try { obj = JSON.parse(jsonStr); } catch (e) {}
    const r = objToRows(obj);
    setRows(r.length ? r : [newRow('', '', 'text')]);   // empty data → one blank row in the table
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [active, isVariantMode, loading]);

  function applyVariants(vs, name) {
    const names = Object.keys(vs);
    const a = names.includes(name) ? name : names[0] || null;
    setIsVariantMode(names.length > 0);
    setVariants(vs);
    setVariantNames(names);
    setActive(a);
    setJsonStr(JSON.stringify(a ? vs[a] : {}, null, 2));
    setDirty(false);
  }

  function selectVariant(name) {
    setActive(name);
    setJsonStr(JSON.stringify(variants[name] || {}, null, 2));
    setDirty(false);
  }

  async function save() {
    if (!valid) { toast('Invalid JSON — fix before saving'); return; }
    const res = await window.ats.saveTcData({ flowId, tcId, data: parsed, variant: isVariantMode ? active : null });
    if (res && res.success) {
      if (isVariantMode && active) setVariants(v => ({ ...v, [active]: parsed }));
      setDirty(false);
      toast('Test data saved');
    } else { toast('Save failed: ' + ((res && res.error) || 'unknown')); }
  }

  async function doDelete() {
    if (!isVariantMode || !active) { toast('No variant to delete'); return; }
    if (!window.confirm(`Delete variant "${active}"?`)) return;
    const res = await window.ats.deleteTcVariant({ flowId, tcId, variantName: active });
    if (res && res.success) { toast(`Variant "${active}" deleted`); await reload(); }
    else toast('Delete failed: ' + ((res && res.error) || 'unknown'));
  }

  async function openTemplates() {
    const list = await window.ats.listTemplates();
    setTemplates(list || []);
  }
  async function applyTemplate(name) {
    setTemplates(null);
    const data = await window.ats.loadTemplate(name);
    if (data) { setJsonStr(JSON.stringify(data, null, 2)); setRows(objToRows(data)); setDirty(true); toast(`Template "${name}" loaded — review and Save`); }
    else toast('Template empty or not found');
  }

  async function confirmPrompt() {
    const p = namePrompt;
    setNamePrompt(null);
    if (!p) return;
    const name = (p.value || '').trim();
    if (!name) return;
    if (p.mode === 'new' || p.mode === 'dup') {
      const res = await window.ats.addTcVariant({ flowId, tcId, variantName: name, copyFrom: p.mode === 'dup' ? active : null });
      if (res && res.success) { toast(`Variant "${name}" created`); applyVariants(res.variants, name); }
      else toast('Failed: ' + ((res && res.error) || 'unknown'));
    } else if (p.mode === 'tpl') {
      if (!valid) { toast('Invalid JSON — fix before saving template'); return; }
      const res = await window.ats.saveTemplate({ name, data: parsed });
      if (res && res.success) toast(`Template "${name}" saved`);
      else toast('Failed: ' + ((res && res.error) || 'unknown'));
    }
  }

  if (loading) return <div style={{ padding: 24, color: 'var(--text-3)', fontSize: 12 }}>Loading test data…</div>;

  const promptLabel = namePrompt && (namePrompt.mode === 'tpl' ? 'Template name' : namePrompt.mode === 'dup' ? 'New variant (copy of ' + active + ')' : 'New variant name');

  return (
    <>
      {(() => {
        const inner = (<>
          {/* view mode — labels kept (primary switch) */}
          <div className="ds-seg">
            <button className={mode === 'table' ? 'on' : ''} onClick={goTable} title="Edit as a key / value table"><I.Table size={12} /> Table</button>
            <button className={mode === 'raw' ? 'on' : ''} onClick={goRaw} title="Edit raw JSON"><I.Braces size={12} /> Raw</button>
          </div>
          {mode === 'raw' && (
            <button className="ds-ic" onClick={formatJson} disabled={!valid} title="Reformat / prettify the JSON"><I.Sparkle size={14} /></button>
          )}
          <div className="ds-div"></div>
          {/* data set selector */}
          {lockedVariant ? (
            <span style={{ fontSize: 11.5, fontFamily: 'var(--mono)', color: 'var(--text-2)' }}>{lockedVariant} <span style={{ color: 'var(--text-3)', fontSize: 10.5 }}>(locked from {tcId})</span></span>
          ) : isVariantMode ? (

// Bucket each captured API call into the step (checkpoint) whose time window contains it,
// using checkpoint `ts` (step end). Calls after the last step land in `other`.
function groupNet(checkpoints, calls) {
  const steps = (checkpoints || []).map(c => ({ cp: c, calls: [] }));
  const other = [];
  const haveTs = steps.some(s => typeof s.cp.ts === 'number');
  if (!haveTs) return { steps, other: calls || [] };
  const sorted = [...(calls || [])].sort((a, b) => (a.started_ms || 0) - (b.started_ms || 0));
  for (const call of sorted) {
    const ms = call.started_ms || 0;
    let placed = false;
    for (let i = 0; i < steps.length; i++) {
      if (typeof steps[i].cp.ts === 'number' && ms <= steps[i].cp.ts) { steps[i].calls.push(call); placed = true; break; }
    }
    if (!placed) other.push(call);
  }
  return { steps, other };
}
const stepClass = (st) => (st === 'PASS' ? 'pass' : st === 'FAIL' ? 'fail' : 'skip');

// One API call — collapsed to method/status/url, expands to request payload + response body.
function NetCall({ c }) {
  const [open, setOpen] = useState(false);
  const col = c.ok ? 'var(--pass)' : 'var(--fail)';
  return (
    <div style={{ borderTop: '1px solid var(--border)' }}>
      <div onClick={() => setOpen(o => !o)} style={{ display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer', fontFamily: 'var(--mono)', fontSize: 10.5, padding: '3px 0' }}>
        <I.ChevronRight size={9} style={{ transform: open ? 'rotate(90deg)' : 'none', transition: 'transform .12s', color: 'var(--text-3)' }} />
        <span style={{ fontWeight: 700, minWidth: 40 }}>{c.method}</span>
        <span style={{ color: col, minWidth: 26 }}>{c.status == null ? 'ERR' : c.status}</span>
        <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: 'var(--text-2)' }} title={c.url}>{c.url}</span>
        <span style={{ color: 'var(--text-3)' }}>{c.duration_ms}ms</span>
      </div>
      {open && (
        <div style={{ padding: '2px 0 6px 16px', fontFamily: 'var(--mono)', fontSize: 10 }}>
          {c.failure && <div style={{ color: 'var(--fail)' }}>failure: {c.failure}</div>}
          {c.request_body && <NetPre label="Request payload" text={c.request_body} />}
          {c.response_body && <NetPre label="Response" text={c.response_body} />}
          {!c.request_body && !c.response_body && !c.failure && <div style={{ color: 'var(--text-3)' }}>(no body captured)</div>}
        </div>
      )}
    </div>
  );
}

function ResultsView({ history, trend, onCreateBug, openTab, runId, toast }) {
  const run = useMemo(() => {
    if (runId) {
      const found = history.find(h => h.id === runId);
      if (found) return found;
    }
    return history[0];
  }, [runId, history]);

  const idx = history.findIndex(h => h.id === run.id);
  const prev = idx >= 0 && idx < history.length - 1 ? history[idx + 1] : null;

  const [artifacts, setArtifacts] = useState(null);
  const [expandedTest, setExpandedTest] = useState(null);
  const [network, setNetwork] = useState(null);   // { key|tc_id: [calls] }, lazy-loaded on expand
  useEffect(() => {
    let cancelled = false;
    if (run && run.id && run.id !== 'empty') {
      window.ats.getRunArtifacts(run.id).then(a => { if (!cancelled) setArtifacts(a); });
    } else { setArtifacts(null); }
    setExpandedTest(null); setNetwork(null);   // reset when switching runs
    return () => { cancelled = true; };
  }, [run.id]);
  const toggleTest = (t) => {
    setExpandedTest(prev => (prev === t.id ? null : t.id));
    if (!network && run && run.id && run.id !== 'empty') {
      window.ats.getRunNetwork(run.id).then(m => setNetwork(m || {})).catch(() => setNetwork({}));
    }
  };

  const openReport = () => {
    if (artifacts && artifacts.report) window.ats.openReport(artifacts.report);
    else toast && toast('No report file for this run');
  };
  const openFolder = () => {
    const f = (artifacts && artifacts.folder) || ('results/' + run.id);
    window.ats.openFolder(f);
  };
  const openVideo = () => {
    if (artifacts && artifacts.videos && artifacts.videos.length) window.ats.openFile(artifacts.videos[0].path);
    else toast && toast('No video for this run');
  };
  const openTrace = () => {
    // With retain-on-failure (default), only failed tests have a trace, so the
    // first trace is the most relevant one to open.
    if (artifacts && artifacts.traces && artifacts.traces.length) window.ats.openTrace(artifacts.traces[0].path);
    else toast && toast('No trace saved for this run — set tracing to "on" in Settings to capture passing runs too');
  };

  const total7 = trend.slice(-7).reduce((s, d) => s + d.total, 0);
  const pass7 = trend.slice(-7).reduce((s, d) => s + d.passed, 0);
  const rate = total7 ? Math.round((pass7 / total7) * 100) : 0;
  const sumTotal = Math.max(1, run.passed + run.failed + run.skipped);
  const passRate = Math.round((run.passed / sumTotal) * 100);

  // Build per-test execution list. Prefer the authoritative per-run results
  // embedded by the runner (JUnit-derived: real status, duration, error,
  // verdict, warnings, flaky). Fall back to the old module-state mapping only
  // for legacy runs recorded before per-run results existed.
  const executed = useMemo(() => {
    const byId = {};
    MODULES.forEach(m => m.tests.forEach(t => { byId[t.id] = { ...t, module: m }; }));
    if (run.results && run.results.length) {
      return run.results.map(r => {
        const base = byId[r.tc_id] || {
          id: r.tc_id, title: r.tc_id, checkpoints: [],
          module: { id: 'unknown', name: 'Other', icon: 'Folder' },
        };
        return {
          ...base,
          key: r.key || r.tc_id,
          lastStatus: r.status,
          lastDuration: (r.duration != null ? r.duration.toFixed(1) + 's' : '—'),
          error: r.error || '',
          verdict: r.verdict,
          warnings: r.warnings || 0,
          flaky: !!r.flaky,
          healCount: r.heal_count || 0,
          network_count: r.network_count || 0,
          runCheckpoints: r.checkpoints || [],
        };
      });
    }
    return (run.tcs || []).map(id => byId[id]).filter(Boolean);
  }, [run]);

  const failedTests = executed.filter(t => t.lastStatus === 'fail');
  const passedTests = executed.filter(t => t.lastStatus === 'pass');
  const skippedTests = executed.filter(t => t.lastStatus === 'skip');

  // ── Self-healing + trace artifacts for this run ──
  const healFiles = (artifacts && artifacts.heals) || [];
  const totalHeals = healFiles.reduce((s, h) => s + (h.count || 0), 0);
  const traceByTc = {};
  ((artifacts && artifacts.traces) || []).forEach(t => { traceByTc[t.name] = t.path; });
  const healByTc = {};
  healFiles.forEach(h => { healByTc[h.name] = h; });

  // Per-module breakdown
  const modBreakdown = useMemo(() => {
    const map = {};
    executed.forEach(t => {
      if (!map[t.module.id]) map[t.module.id] = { id: t.module.id, name: t.module.name, icon: t.module.icon, p: 0, f: 0, s: 0, total: 0, dur: 0 };
      const slot = map[t.module.id];
      slot.total++;
      if (t.lastStatus === 'pass') slot.p++;
      else if (t.lastStatus === 'fail') slot.f++;
      else if (t.lastStatus === 'skip') slot.s++;
      slot.dur += parseFloat(t.lastDuration) || 0;
    });
    return Object.values(map);
  }, [executed]);

  // Donut math (radius 36, circ ~226)
  const R = 36, C = 2 * Math.PI * R;
  const passLen = (run.passed / sumTotal) * C;
  const failLen = (run.failed / sumTotal) * C;
  const skipLen = (run.skipped / sumTotal) * C;

  const dateStr = run.when.slice(0, 10);
  const timeStr = run.when.slice(11);

  return (
    <div className="results-view">
      <div className="results-content">

        {/* ─── Hero: run metadata + donut ─── */}
        <header className="rv-hero">
          <div className="rv-hero-l">
            <div className="rv-hero-eyebrow">
              <span className={`rv-status-pill ${run.status}`}>
                <span className="dot"></span>
                {run.status === 'pass' ? 'Completed' : 'Failed'}
              </span>
              <span className="rv-hero-time">{dateStr} · {timeStr}</span>
            </div>
            <h1 className="rv-hero-title">
              {run.failed > 0 ? `${run.failed} test${run.failed > 1 ? 's' : ''} failed` : `All ${run.passed} tests passed`}
            </h1>
            <div className="rv-hero-meta">
              <span className="rv-meta"><I.User size={12} /> Triggered by you</span>
              <span className="rv-meta"><I.GitMerge size={12} /> dev</span>
              <span className="rv-meta"><I.Zap size={12} /> Sequential</span>
              <span className="rv-meta"><I.Clock size={12} /> {run.duration.toFixed(1)}s</span>
              {totalHeals > 0 && <span className="rv-meta" style={{ color: 'var(--accent)' }}><I.Activity size={12} /> {totalHeals} auto-healed</span>}
              {run.flaky > 0 && <span className="rv-meta" style={{ color: '#c2410c' }}><I.RefreshCw size={12} /> {run.flaky} flaky</span>}
              {run.warnings > 0 && <span className="rv-meta" style={{ color: '#b45309' }}>⚠ {run.warnings} warning{run.warnings > 1 ? 's' : ''}</span>}
            </div>
            <div className="rv-hero-actions">
              {run.failed > 0 && (
                <button className="rv-cta danger" onClick={() => onCreateBug && onCreateBug(failedTests[0] || { id: run.id, title: 'Run ' + run.id + ' had failures', module: { id: '', name: '' } })}>
                  <I.Bug size={13} /> Raise bug
                </button>
              )}
              <button className="rv-cta primary"><I.RefreshCw size={13} /> Re-run this set</button>
              <button className="rv-cta" onClick={openReport}><I.BarChart size={13} /> Full report</button>
              <button className="rv-cta" onClick={openFolder}><I.FolderOpen size={13} /> Open folder</button>
              <button className="rv-cta" onClick={openVideo}><I.Video size={13} /> Video</button>
              {artifacts && artifacts.traces && artifacts.traces.length > 0 && (
                <button className="rv-cta" onClick={openTrace} title="Open the Playwright trace — time-travel debugging with DOM snapshots, network & console">
                  <I.Activity size={13} /> Trace
                </button>
              )}
            </div>
          </div>

          <div className="rv-hero-r">
            <svg className="rv-donut" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r={R} fill="none" stroke="var(--border)" strokeWidth="10" />
              <circle cx="50" cy="50" r={R} fill="none" stroke="var(--pass)" strokeWidth="10"
                strokeDasharray={`${passLen} ${C}`}
                transform="rotate(-90 50 50)"
                strokeLinecap="butt"
              />
              <circle cx="50" cy="50" r={R} fill="none" stroke="var(--fail)" strokeWidth="10"
                strokeDasharray={`${failLen} ${C}`}
                strokeDashoffset={`${-passLen}`}
                transform="rotate(-90 50 50)"
              />
              <circle cx="50" cy="50" r={R} fill="none" stroke="var(--skip)" strokeWidth="10"
                strokeDasharray={`${skipLen} ${C}`}
                strokeDashoffset={`${-(passLen + failLen)}`}
                transform="rotate(-90 50 50)"
              />
              <text x="50" y="48" textAnchor="middle" className="rv-donut-num">{passRate}%</text>
              <text x="50" y="62" textAnchor="middle" className="rv-donut-lbl">PASS RATE</text>
            </svg>
            <div className="rv-donut-legend">
              <div className="rv-legend-item"><span className="sw pass"></span><span>{run.passed} passed</span></div>
              <div className="rv-legend-item"><span className="sw fail"></span><span>{run.failed} failed</span></div>
              <div className="rv-legend-item"><span className="sw skip"></span><span>{run.skipped} skipped</span></div>
            </div>
          </div>
        </header>

        {/* ─── Per-module breakdown ─── */}
        {modBreakdown.length > 0 && (
          <section className="rv-block">
            <div className="rv-block-head">
              <h3 className="rv-block-title">By module</h3>
            </div>
            <div className="rv-modgrid">
              {modBreakdown.map(m => {
                const Icon = I[m.icon] || I.Folder;
                const mTotal = Math.max(1, m.p + m.f + m.s);
                return (
                  <div className="rv-mod" key={m.id}>
                    <div className="rv-mod-head">
                      <span className="rv-mod-ic"><Icon size={14} /></span>
                      <span className="rv-mod-name">{m.name}</span>
                      <span className="rv-mod-count">{m.total}</span>
                    </div>
                    <div className="rv-mod-bar">
                      <div className="b-pass" style={{ width: `${(m.p / mTotal) * 100}%` }}></div>
                      <div className="b-fail" style={{ width: `${(m.f / mTotal) * 100}%` }}></div>
                      <div className="b-skip" style={{ width: `${(m.s / mTotal) * 100}%` }}></div>
                    </div>
                    <div className="rv-mod-stats">
                      {m.p > 0 && <span className="p">{m.p} pass</span>}
                      {m.f > 0 && <span className="f">{m.f} fail</span>}
                      {m.s > 0 && <span className="s">{m.s} skip</span>}
                      <span className="d">{m.dur.toFixed(1)}s</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </section>
        )}

        {/* ─── Failures ─── */}
        {failedTests.length > 0 && (
          <section className="rv-block">
            <div className="rv-block-head">
              <h3 className="rv-block-title">Failures</h3>
              <span className="rv-block-count fail">{failedTests.length}</span>
            </div>
            <div className="rv-failures">
              {failedTests.map(f => (
                <div className="rv-failure" key={f.id}>
                  <div className="rv-failure-top">
                    <span className="tc-status-dot fail" style={{ width: 8, height: 8 }}></span>
                    <span className="tc-id">{f.id}</span>
                    <span className="rv-failure-title">{f.title}</span>
                    <span style={{ flex: 1 }}></span>
                    <span style={{ fontSize: 10.5, color: 'var(--text-3)', fontFamily: 'var(--mono)' }}>{f.lastDuration}</span>
                  </div>
                  <div className="rv-failure-error">{f.error}</div>
                  <div className="rv-failure-actions">
                    <button onClick={() => openTab(f.id, 'steps')}><I.GitMerge size={11} /> View steps</button>
                    <button><I.Camera size={11} /> Screenshot</button>
                    {traceByTc[f.id] && <button onClick={() => window.ats.openTrace(traceByTc[f.id])} title="Open the Playwright trace for this test"><I.Activity size={11} /> Trace</button>}
                    <button><I.RefreshCw size={11} /> Re-run</button>
                    <button className="raise-bug" onClick={() => onCreateBug && onCreateBug(f)}>
                      <I.Bug size={11} /> Raise bug
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </section>
        )}

        {/* ─── Self-healed locators ─── */}
        {totalHeals > 0 && (
          <section className="rv-block">
            <div className="rv-block-head">
              <h3 className="rv-block-title">Self-healed locators</h3>
              <span className="rv-block-count" style={{ background: 'var(--accent-bg)', color: 'var(--accent)' }}>{totalHeals}</span>
            </div>
            <p style={{ fontSize: 11.5, color: 'var(--text-2)', margin: '0 0 8px' }}>
              These locators drifted (the UI changed) but the run recovered automatically — no test edits needed.
            </p>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {healFiles.filter(h => h.count > 0).map(h => (
                <div key={h.name} style={{ border: '1px solid var(--border)', borderRadius: 6, padding: '8px 10px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 6 }}>
                    <I.Activity size={12} />
                    <span className="tc-id">{h.name}</span>
                    <span style={{ flex: 1 }}></span>
                    <span style={{ fontSize: 10.5, color: 'var(--accent)', fontFamily: 'var(--mono)' }}>{h.count} healed</span>
                  </div>
                  {(h.events || []).map((e, i) => (
                    <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 11, fontFamily: 'var(--mono)', color: 'var(--text-2)', padding: '2px 0' }}>
                      <code style={{ color: 'var(--fail)' }}>{e.primary}</code>
                      <span style={{ color: 'var(--text-3)' }}>→</span>
                      <code style={{ color: 'var(--pass)' }}>{e.healed_via}</code>
                      <span style={{ flex: 1 }}></span>
                      <span style={{ fontSize: 9.5, textTransform: 'uppercase', color: 'var(--text-3)' }}>{e.tier}{e.confidence ? ` ${Math.round(e.confidence * 100)}%` : ''}</span>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          </section>
        )}

        {/* ─── Full execution timeline ─── */}
        {executed.length > 0 && (
          <section className="rv-block">
            <div className="rv-block-head">
              <h3 className="rv-block-title">Execution timeline</h3>
              <span className="rv-block-count">{executed.length}</span>
            </div>
            <div className="rv-timeline">
              {executed.map((t, i) => {
                const open = expandedTest === t.id;
                const calls = network ? (network[t.key] || network[t.id] || []) : null;
                const grouped = open ? groupNet(t.runCheckpoints, calls || []) : null;
                return (
                  <React.Fragment key={t.id}>
                    <div className="rv-tl-row" style={{ cursor: 'pointer' }} onClick={() => toggleTest(t)}
                      title="Show step-wise log + the API calls behind each step">
                      <span className="rv-tl-num">{String(i + 1).padStart(2, '0')}</span>
                      <I.ChevronRight size={11} style={{ transform: open ? 'rotate(90deg)' : 'none', transition: 'transform .12s', color: 'var(--text-3)' }} />
                      <span className={`tc-status-dot ${t.lastStatus}`} style={{ width: 7, height: 7 }}></span>
                      <span className="tc-id">{t.id}</span>
                      <span className="rv-tl-title">{t.title}</span>
                      <span style={{ flex: 1 }}></span>
                      {t.runCheckpoints && t.runCheckpoints.length > 0 && <span style={{ fontSize: 10, color: 'var(--text-3)', fontFamily: 'var(--mono)' }}>{t.runCheckpoints.length} steps</span>}
                      {t.network_count > 0 && <span title={`${t.network_count} API call(s) captured`} style={{ fontSize: 10, color: 'var(--accent)', fontFamily: 'var(--mono)', display: 'inline-flex', alignItems: 'center', gap: 2 }}><I.Activity size={10} /> {t.network_count}</span>}
                      {(t.healCount > 0 || healByTc[t.id]) && <span title="locator(s) auto-healed" style={{ fontSize: 10, color: 'var(--accent)', fontFamily: 'var(--mono)' }}>🔧 {t.healCount || (healByTc[t.id] && healByTc[t.id].count)}</span>}
                      {t.flaky && <span title="Passed only after a retry" style={{ fontSize: 9.5, fontWeight: 700, color: '#c2410c', fontFamily: 'var(--mono)' }}>FLAKY</span>}
                      {t.warnings > 0 && <span title={`${t.warnings} non-critical checkpoint warning(s)`} style={{ fontSize: 10, color: '#b45309', fontFamily: 'var(--mono)' }}>⚠ {t.warnings}</span>}
                      <span className={`rv-tl-status ${t.lastStatus}`}>{t.lastStatus.toUpperCase()}</span>
                      <span className="rv-tl-dur">{t.lastDuration}</span>
                    </div>
                    {open && <RunTestDetail t={t} grouped={grouped} network={network} />}
                  </React.Fragment>
                );
              })}
            </div>
          </section>
        )}

      </div>
    </div>
  );
}


function RightToolWindow({ running, history, trend, sectionsOpen, toggleSection, onCreateBug, openTab, onClose }) {

  const pass7 = trend.slice(-7).reduce((s, d) => s + d.passed, 0);
  const rate = total7 ? Math.round((pass7 / total7) * 100) : 0;

  return (
    <aside className="tw right">
      <div className="tw-head">
        <span className="tw-title">Results</span>
        <button className="ic" title="Hide" onClick={onClose}><I.X size={12} /></button>
      </div>

      <div className="tw-toolbar">
        <span style={{ fontSize: 10.5, color: 'var(--text-3)', padding: '0 6px' }}>Last run</span>
        <span style={{ fontSize: 11, fontFamily: 'var(--mono)', color: 'var(--text)' }}>{last.when.slice(11)}</span>
        <div className="tw-toolbar-spacer"></div>
        <button className="ic" title="View full report"><I.BarChart size={13} /></button>
      </div>

      <div className="results-body">
        {/* Last run */}
        <div className="lrc">
          <div className="lrc-head">
            <div className="lrc-when"><span className="label">Last run</span>{last.when}</div>
            <span className={`lrc-badge ${last.status}`}>{last.status === 'pass' ? 'COMPLETED' : 'FAILED'}</span>

            <div className="lrc-stat pass"><span className="val">{last.passed}</span><span className="lbl">Passed</span></div>
            <div className="lrc-stat fail"><span className="val">{last.failed}</span><span className="lbl">Failed</span></div>
            <div className="lrc-stat skip"><span className="val">{last.skipped}</span><span className="lbl">Skipped</span></div>
          </div>
          <div className="lrc-bar">
            <div className="b-pass" style={{ width: `${(last.passed / Math.max(1, last.passed + last.failed + last.skipped)) * 100}%` }}></div>
            <div className="b-fail" style={{ width: `${(last.failed / Math.max(1, last.passed + last.failed + last.skipped)) * 100}%` }}></div>
            <div className="b-skip" style={{ width: `${(last.skipped / Math.max(1, last.passed + last.failed + last.skipped)) * 100}%` }}></div>

        {/* Trend */}

        >
          <div className="trend">
            <div className="trend-head">
              <span className="title">Daily runs</span>
              <span className="rate">
                {rate}%
                <span className="delta up"><I.TrendingUp size={10} /> +4%</span>
              </span>
            </div>
            <Sparkline data={trend} />
            <div className="trend-axis">
              <span>{trend[0].day}</span>
              <span>{trend[trend.length - 1].day}</span>
            </div>

        </CollapsibleSection>

        {/* History */}
        <CollapsibleSection
          id="history"

          {history.map(h => (
            <div className="history-row" key={h.id}>

              <div className="info">
                <div className="when">{h.when.slice(11)}</div>
                <div className="tcs" title={h.tcs.join(', ')}>
                  {h.tcs[0]}{h.tcs.length > 1 ? ` +${h.tcs.length - 1}` : ''}
                </div>
              </div>
              <div className="stats">
                <span className="p">{h.passed}</span>·<span className="f">{h.failed}</span>·<span>{h.skipped}</span>
              </div>
