          ))}
        </CollapsibleSection>
      </div>
    </aside>
  );
}

function CollapsibleSection({ id, title, count, countClass, rightText, open, onToggle, noBodyPadding, children }) {
  return (
    <div className="tw-section">
      <div className="tw-section-head" onClick={onToggle}>
        <span className={`caret${open ? ' open' : ''}`}><I.ChevronRight size={10} /></span>
        <span>{title}</span>
        {rightText && <span style={{ marginLeft: 'auto', fontSize: 11, fontFamily: 'var(--mono)', color: 'var(--text)', fontWeight: 600, textTransform: 'none', letterSpacing: 0 }}>{rightText}</span>}
        {count !== undefined && <span className={`count ${countClass || ''}`}>{count}</span>}
      </div>
      {open && <div className="tw-section-body" style={noBodyPadding ? { padding: 0 } : null}>{children}</div>}
    </div>
  );
}

function Sparkline({ data }) {
  const max = Math.max(1, ...data.map(d => d.total));
  return (
    <div className="spark">
      {data.map((d, i) => {
        const h = (d.total / max) * 100;
        const passH = d.total ? (d.passed / d.total) * 100 : 0;
        return (
          <div key={i} className={`spark-bar${d.failed > 0 ? ' f' : ''}`} style={{ height: `${Math.max(4, h)}%` }} title={`${d.day} · ${d.passed}P · ${d.failed}F`}>
            <div className="p" style={{ height: `${passH}%` }}></div>
          </div>
        );
      })}
    </div>
  );
}

/* ──────────────────────────────────────────────────────────────
   Command Palette
   ────────────────────────────────────────────────────────────── */
function CommandPalette({ onClose, modules, openTab, runSelected, setSettingsOpen, setShortcutsOpen, setTheme, theme, toast }) {
  const [q, setQ] = useState('');
  const [focus, setFocus] = useState(0);
  const inputRef = useRef(null);
  useEffect(() => { inputRef.current?.focus(); }, []);

  const actions = useMemo(() => [
    { id: 'run', label: 'Run selected tests', icon: 'Play', group: 'Actions', shortcut: '⌘ ↵', do: () => { onClose(); setTimeout(runSelected, 50); } },
    { id: 'record', label: 'Record new test…', icon: 'Record', group: 'Actions', do: () => { onClose(); window.setModalState({ isOpen: true, type: 'record' }); } },
    { id: 'settings', label: 'Open settings', icon: 'Settings', group: 'Navigate', shortcut: '⌘ ,', do: () => { onClose(); setSettingsOpen(true); } },
    { id: 'shortcuts', label: 'Show keyboard shortcuts', icon: 'Keyboard', group: 'Navigate', shortcut: '?', do: () => { onClose(); setShortcutsOpen(true); } },
    { id: 'theme', label: theme === 'light' ? 'Switch to dark theme' : 'Switch to light theme', icon: theme === 'light' ? 'Moon' : 'Sun', group: 'Appearance', do: () => { setTheme(theme === 'light' ? 'dark' : 'light'); onClose(); } },
    { id: 'report', label: 'Open last run report', icon: 'BarChart', group: 'Reports', do: () => { onClose(); toast('Opening report…'); } },
    { id: 'folder', label: 'Open results folder', icon: 'FolderOpen', group: 'Reports', do: () => { onClose(); toast('Opening folder…'); } },
    { id: 'jira', label: 'Test Jira connection', icon: 'ExternalLink', group: 'Integrations', do: () => { onClose(); toast('Jira connection OK'); } },
    { id: 'export', label: 'Export run history as CSV', icon: 'Download', group: 'Reports', do: () => { onClose(); toast('Exporting history…'); } },
    { id: 'schedule', label: 'Schedule a recurring run…', icon: 'Calendar', group: 'Schedule', do: () => { onClose(); toast('Schedule editor opened'); } },
  ], [theme, runSelected, onClose, setSettingsOpen, setShortcutsOpen, setTheme, toast]);

  const items = useMemo(() => {
    const out = [];
    const ql = q.toLowerCase().trim();
    const acts = actions.filter(a => !ql || a.label.toLowerCase().includes(ql) || a.group.toLowerCase().includes(ql));
    if (acts.length) {
      out.push({ kind: 'section', label: 'Actions' });
      acts.forEach(a => out.push({ kind: 'item', ...a }));
    }
    const tests = [];
    modules.forEach(m => m.tests.forEach(t => {
      if (!ql || `${t.id} ${t.title}`.toLowerCase().includes(ql)) {
        tests.push({ ...t, module: m.name });
      }
    }));
    if (tests.length) {
      out.push({ kind: 'section', label: 'Jump to test' });
      tests.slice(0, 10).forEach(t => out.push({
        kind: 'item', id: t.id, label: t.title, icon: 'FileText',
        group: t.module + ' · ' + t.id,
        do: () => { openTab(t.id, t.hasData ? 'data' : 'story'); onClose(); }
      }));
    }
    return out;
  }, [q, actions, modules, openTab, onClose]);

  const focusable = items.map((it, i) => it.kind === 'item' ? i : -1).filter(i => i >= 0);
  useEffect(() => { if (focus >= focusable.length) setFocus(0); }, [items.length]);

  const onKey = (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setFocus(f => Math.min(focusable.length - 1, f + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setFocus(f => Math.max(0, f - 1)); }
    else if (e.key === 'Enter') {
      const idx = focusable[focus];
      const it = items[idx];
      if (it && it.do) it.do();
    } else if (e.key === 'Escape') onClose();
  };

  return (
    <div className="cmd-overlay" onClick={onClose}>
      <div className="cmd-modal" onClick={e => e.stopPropagation()}>
        <div className="cmd-input">
          <I.Search size={15} style={{ color: 'var(--text-3)' }} />
          <input ref={inputRef} value={q} onChange={e => { setQ(e.target.value); setFocus(0); }} onKeyDown={onKey} placeholder="Search tests or run a command…" />
          <span style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-3)' }}>esc</span>
        </div>
        <div className="cmd-list">
          {items.length === 0 && (
            <div style={{ padding: 20, textAlign: 'center', color: 'var(--text-3)', fontSize: 12 }}>No results</div>
          )}
          {items.map((it, i) => {
            if (it.kind === 'section') return <div className="cmd-section" key={'s' + i}>{it.label}</div>;
            const Icon = I[it.icon] || I.File;
            const isFocused = focusable[focus] === i;
            return (
              <div className={`cmd-item${isFocused ? ' focused' : ''}`} key={it.id + i}
                   onMouseEnter={() => setFocus(focusable.indexOf(i))}
                   onClick={() => it.do && it.do()}>
                <span className="icn"><Icon size={13} /></span>
                <span className="lbl">{it.label}</span>
                {it.group && <span className="grp">{it.group}</span>}
                {it.shortcut && <span className="sc">{it.shortcut}</span>}
              </div>
            );
          })}
        </div>
        <div className="cmd-foot">
          <span><kbd>↑</kbd> <kbd>↓</kbd> navigate</span>
          <span><kbd>↵</kbd> select</span>
          <span><kbd>esc</kbd> close</span>
          <span style={{ flex: 1 }}></span>
          <span>{items.filter(i => i.kind === 'item').length} results</span>
        </div>
      </div>
    </div>
  );
}

/* ──────────────────────────────────────────────────────────────
   Settings Sheet
   ────────────────────────────────────────────────────────────── */
function SettingsSheet({ onClose, headless, setHeadless, toast }) {
  const [config, setConfig] = useState({});
  const [loading, setLoading] = useState(true);
  const [jiraStatus, setJiraStatus] = useState('');
  const [jiraStatusColor, setJiraStatusColor] = useState('var(--text-3)');
  const [secretStatus, setSecretStatus] = useState({});
  const [keyDraft, setKeyDraft] = useState({});  // { ATS_ANTHROPIC_KEY: '...' }

  useEffect(() => {
    if (window.ats && window.ats.getSecretStatus) {
      window.ats.getSecretStatus().then(r => setSecretStatus((r && r.keys) || {})).catch(() => {});
    }
  }, []);
  const saveKey = async (envName) => {
    const val = keyDraft[envName];
    if (val == null) return;
    await window.ats.setSecret({ key: envName, value: val });
    const r = await window.ats.getSecretStatus();
    setSecretStatus((r && r.keys) || {});
    setKeyDraft(d => ({ ...d, [envName]: undefined }));
    toast && toast(val ? 'Key saved to OS keychain' : 'Key cleared');
  };
  const updateLlm = (k, v) => setConfig(prev => ({ ...prev, llm: { ...(prev.llm || {}), [k]: v } }));
  const updateLlmModel = (provider, model) => setConfig(prev => {
    const llm = prev.llm || {}; const providers = { ...(llm.providers || {}) };
    providers[provider] = { ...(providers[provider] || {}), model };
    return { ...prev, llm: { ...llm, providers } };
  });
  const updatePassCriteria = (k, v) => setConfig(prev => ({ ...prev, pass_criteria: { ...(prev.pass_criteria || {}), [k]: v } }));

  useEffect(() => {
    if (window.ats && window.ats.getConfig) {
      window.ats.getConfig().then(c => {
        setConfig(c || {});
        setLoading(false);
      }).catch(() => setLoading(false));
    } else {
      setLoading(false);
    }
  }, []);

  const handleSave = async () => {
    if (window.ats && window.ats.saveConfig) {
      await window.ats.saveConfig(config);
      // Reload USERS and ADMINS in window context
      window.USERS = (config.platforms?.seller?.users || []).map((u, i) => ({
        id: `seller-${i}`,
        name: u.label || `Seller ${i + 1}`,
        email: u.email || '',
        password: u.password || '',
      }));
      window.ADMINS = (config.platforms?.admin?.users || []).map((u, i) => ({
        id: `admin-${i}`,
        name: u.label || `Admin ${i + 1}`,
        email: u.email || '',
        password: u.password || '',
      }));
    }
    if (toast) {
      toast('Settings saved successfully.');
    }
    onClose();
  };

  const updateJira = (k, v) => {
    setConfig(prev => ({
      ...prev,
      jira: { ...(prev.jira || {}), [k]: v }
    }));
  };

  const updateSellerUser = (index, k, v) => {
    setConfig(prev => {
      const users = [...(prev.platforms?.seller?.users || prev.users || [])];
      if (users[index]) {
        users[index] = { ...users[index], [k]: v };
      }
      return {
        ...prev,
        platforms: {
          ...(prev.platforms || {}),
          seller: {
            ...(prev.platforms?.seller || {}),
            users
          }
        }
      };
    });
  };

  const updateAdminUser = (index, k, v) => {
    setConfig(prev => {
      const users = [...(prev.platforms?.admin?.users || prev.admin_users || [])];
      if (users[index]) {
        users[index] = { ...users[index], [k]: v };
      }
      return {
        ...prev,
        platforms: {
          ...(prev.platforms || {}),
          admin: {
            ...(prev.platforms?.admin || {}),
            users
          }
        }
      };
    });
  };

  const updateSchedule = (v) => {
    setConfig(prev => ({
      ...prev,
      schedule: v
    }));
  };

  const updateTracing = (v) => {
    setConfig(prev => ({
      ...prev,
      tracing: { ...(prev.tracing || {}), mode: v }
    }));
  };

  const testJira = async () => {
    setJiraStatus('Testing...');
    setJiraStatusColor('var(--text-3)');
    try {
      await window.ats.saveConfig(config);
      const res = await window.ats.testJiraConnection();
      if (res.success) {
        setJiraStatus(`● Connected as ${res.user}`);
        setJiraStatusColor('var(--pass)');
      } else {
        setJiraStatus(`● Failed: ${res.error}`);
        setJiraStatusColor('var(--fail)');
      }
    } catch (err) {
      setJiraStatus(`● Failed: ${err.message || String(err)}`);
      setJiraStatusColor('var(--fail)');
    }
  };

  if (loading) {
    return (
      <>
        <div className="sheet-overlay" onClick={onClose}></div>
        <div className="sheet">
          <div className="sheet-head">
            <h2>Preferences</h2>
            <button className="close-btn" onClick={onClose}><I.X size={14} /></button>
          </div>
          <div className="sheet-body" style={{ display: 'grid', placeItems: 'center', height: '100%' }}>
            <div style={{ color: 'var(--text-3)' }}>Loading preferences...</div>
          </div>
        </div>
      </>
    );
  }

  const sellerUsers = config.platforms?.seller?.users || config.users || [];
  const adminUsers = config.platforms?.admin?.users || config.admin_users || [];

  return (
    <>
      <div className="sheet-overlay" onClick={onClose}></div>
      <div className="sheet">
        <div className="sheet-head">
          <h2>Preferences</h2>
          <button className="close-btn" onClick={onClose}><I.X size={14} /></button>
        </div>
        <div className="sheet-body">
          <div className="sheet-section">
            <h3>Seller Credentials</h3>
            {sellerUsers.map((u, i) => (
              <div className="cred-row" key={i}>
                <span className="name">{u.label || `Seller ${i + 1}`}</span>
                <input value={u.email || ''} onChange={e => updateSellerUser(i, 'email', e.target.value)} placeholder="Email" />
                <input type="password" value={u.password || ''} onChange={e => updateSellerUser(i, 'password', e.target.value)} placeholder="Password" />
              </div>
            ))}
          </div>

          <div className="sheet-section">
            <h3>Admin Credentials</h3>
            {adminUsers.map((u, i) => (
              <div className="cred-row" key={i}>
                <span className="name">{u.label || `Admin ${i + 1}`}</span>
                <input value={u.email || ''} onChange={e => updateAdminUser(i, 'email', e.target.value)} placeholder="Email" />
                <input type="password" value={u.password || ''} onChange={e => updateAdminUser(i, 'password', e.target.value)} placeholder="Password" />
              </div>
            ))}
          </div>

          <div className="sheet-section">
            <h3>Jira Integration</h3>
            <div className="field"><label>Jira URL</label><input value={config.jira?.url || ''} onChange={e => updateJira('url', e.target.value)} placeholder="https://agrim.atlassian.net" /></div>
            <div className="field"><label>Email</label><input value={config.jira?.email || ''} onChange={e => updateJira('email', e.target.value)} placeholder="you@agrim.com" /></div>
            <div className="field"><label>API token</label><input type="password" value={config.jira?.apiToken || ''} onChange={e => updateJira('apiToken', e.target.value)} placeholder="••••••••••••••" /></div>
            <div className="field"><label>Project key</label><input value={config.jira?.projectKey || ''} onChange={e => updateJira('projectKey', e.target.value)} placeholder="PM" /></div>
            <div style={{ display: 'flex', gap: 8, marginTop: 8, alignItems: 'center' }}>
              <button className="editor-action" style={{ height: 26 }} onClick={testJira}><I.RefreshCw size={11} /> Test connection</button>
              {jiraStatus && <span style={{ fontSize: 11, color: jiraStatusColor }}>{jiraStatus}</span>}
            </div>
          </div>

          <div className="sheet-section">
            <h3>Scheduled runs <span style={{ marginLeft: 6, fontSize: 9.5, color: 'var(--accent)', background: 'var(--accent-bg)', padding: '1px 5px', borderRadius: 2, fontFamily: 'var(--mono)', fontWeight: 600 }}>NEW</span></h3>
            <p style={{ fontSize: 11.5, color: 'var(--text-2)', marginBottom: 8 }}>Run test suites automatically on a schedule.</p>
            <div className="field">
              <label>Schedule</label>
              <select value={config.schedule || 'off'} onChange={e => updateSchedule(e.target.value)}>
                <option value="off">Off</option>
                <option value="daily">Daily at 9:00 AM</option>
                <option value="hourly">Hourly during work hours</option>
                <option value="custom">Custom cron…</option>
              </select>
            </div>
          </div>

          <div className="sheet-section">
            <h3>Diagnostics &amp; Self-Healing <span style={{ marginLeft: 6, fontSize: 9.5, color: 'var(--accent)', background: 'var(--accent-bg)', padding: '1px 5px', borderRadius: 2, fontFamily: 'var(--mono)', fontWeight: 600 }}>NEW</span></h3>
            <div className="field">
              <label>Trace recording</label>
              <select value={config.tracing?.mode || 'retain-on-failure'} onChange={e => updateTracing(e.target.value)}>
                <option value="retain-on-failure">On failure only (recommended)</option>
                <option value="on">Every test</option>
                <option value="off">Off</option>
              </select>
            </div>
            <p style={{ fontSize: 11.5, color: 'var(--text-2)', marginTop: 6 }}>
              Traces capture DOM snapshots, network &amp; console for every step — open them with the <strong>Trace</strong> button on a run, or <code style={{ fontFamily: 'var(--mono)' }}>playwright show-trace</code>. Self-healing locators are always on; any auto-heals appear per run in the results view.
            </p>
          </div>

          <div className="sheet-section">
            <h3>AI / LLM <span style={{ marginLeft: 6, fontSize: 9.5, color: 'var(--accent)', background: 'var(--accent-bg)', padding: '1px 5px', borderRadius: 2, fontFamily: 'var(--mono)', fontWeight: 600 }}>NEW</span></h3>
            <div className="field">
              <label>Default provider</label>
              <select value={config.llm?.default_provider || 'mimo'} onChange={e => updateLlm('default_provider', e.target.value)}>
                <option value="mimo">Xiaomi MiMo (v2.5-pro)</option>
                <option value="mimo-ultraspeed">Xiaomi MiMo Ultraspeed (reasoning)</option>
                <option value="anthropic">Claude (Anthropic)</option>
                <option value="openai">OpenAI</option>
                <option value="ollama">Local (Ollama)</option>
                <option value="mock">None — deterministic scaffold</option>
              </select>
            </div>
            <div className="field"><label>MiMo model</label><input value={config.llm?.providers?.mimo?.model || ''} onChange={e => updateLlmModel('mimo', e.target.value)} placeholder="mimo-v2.5-pro" /></div>
            <div className="field"><label>MiMo Ultraspeed model</label><input value={config.llm?.providers?.['mimo-ultraspeed']?.model || ''} onChange={e => updateLlmModel('mimo-ultraspeed', e.target.value)} placeholder="mimo-v2.5-pro-ultraspeed" /></div>
            <div className="field">
              <label>MiMo API key {secretStatus.MIMO_API_KEY && <span style={{ color: 'var(--pass)', fontSize: 10 }}>● set</span>}</label>
              <div style={{ display: 'flex', gap: 6 }}>
                <input type="password" value={keyDraft.MIMO_API_KEY || ''} onChange={e => setKeyDraft(d => ({ ...d, MIMO_API_KEY: e.target.value }))} placeholder={secretStatus.MIMO_API_KEY ? '•••••••• (stored)' : 'from MIMO_API_KEY env or paste here'} />
                <button className="editor-action" style={{ height: 26 }} onClick={() => saveKey('MIMO_API_KEY')}>Save</button>
              </div>
            </div>
            <div className="field">
              <label>MiMo Ultraspeed key (separate plan) {secretStatus.MIMO_API_KEY2 && <span style={{ color: 'var(--pass)', fontSize: 10 }}>● set</span>}</label>
              <div style={{ display: 'flex', gap: 6 }}>
                <input type="password" value={keyDraft.MIMO_API_KEY2 || ''} onChange={e => setKeyDraft(d => ({ ...d, MIMO_API_KEY2: e.target.value }))} placeholder={secretStatus.MIMO_API_KEY2 ? '•••••••• (stored)' : 'from MIMO_API_KEY2 env or paste here'} />
                <button className="editor-action" style={{ height: 26 }} onClick={() => saveKey('MIMO_API_KEY2')}>Save</button>
              </div>
            </div>
            <div className="field"><label>Claude model</label><input value={config.llm?.providers?.anthropic?.model || ''} onChange={e => updateLlmModel('anthropic', e.target.value)} placeholder="claude-opus-4-8" /></div>
            <div className="field">
              <label>Claude API key {secretStatus.ATS_ANTHROPIC_KEY && <span style={{ color: 'var(--pass)', fontSize: 10 }}>● set</span>}</label>
              <div style={{ display: 'flex', gap: 6 }}>
                <input type="password" value={keyDraft.ATS_ANTHROPIC_KEY || ''} onChange={e => setKeyDraft(d => ({ ...d, ATS_ANTHROPIC_KEY: e.target.value }))} placeholder={secretStatus.ATS_ANTHROPIC_KEY ? '•••••••• (stored)' : 'sk-ant-…'} />
                <button className="editor-action" style={{ height: 26 }} onClick={() => saveKey('ATS_ANTHROPIC_KEY')}>Save</button>
              </div>
            </div>
            <div className="field"><label>OpenAI model</label><input value={config.llm?.providers?.openai?.model || ''} onChange={e => updateLlmModel('openai', e.target.value)} placeholder="gpt-4o" /></div>
            <div className="field">
              <label>OpenAI API key {secretStatus.ATS_OPENAI_KEY && <span style={{ color: 'var(--pass)', fontSize: 10 }}>● set</span>}</label>
              <div style={{ display: 'flex', gap: 6 }}>
                <input type="password" value={keyDraft.ATS_OPENAI_KEY || ''} onChange={e => setKeyDraft(d => ({ ...d, ATS_OPENAI_KEY: e.target.value }))} placeholder={secretStatus.ATS_OPENAI_KEY ? '•••••••• (stored)' : 'sk-…'} />
                <button className="editor-action" style={{ height: 26 }} onClick={() => saveKey('ATS_OPENAI_KEY')}>Save</button>
              </div>
            </div>
            <p style={{ fontSize: 11.5, color: 'var(--text-2)', marginTop: 6 }}>Keys are encrypted in your OS keychain — never written to config or the repo. Used by PRD extraction &amp; test synthesis.</p>
          </div>

          <div className="sheet-section">
            <h3>Pass / Fail criteria</h3>
            <div className="field">
              <label>Verdict rule</label>
              <select value={config.pass_criteria?.mode || 'critical_only'} onChange={e => updatePassCriteria('mode', e.target.value)}>
                <option value="critical_only">Critical must pass (others warn)</option>
                <option value="all">Any failure fails</option>
                <option value="threshold">Threshold %</option>
              </select>
            </div>
            {config.pass_criteria?.mode === 'threshold' && (
              <div className="field"><label>Pass threshold %</label><input type="number" value={config.pass_criteria?.threshold_pct ?? 90} onChange={e => updatePassCriteria('threshold_pct', Number(e.target.value))} /></div>
            )}
            <div className="field">
              <label>Skipped checkpoints</label>
              <select value={config.pass_criteria?.treat_skipped_as || 'ignore'} onChange={e => updatePassCriteria('treat_skipped_as', e.target.value)}>
                <option value="ignore">Ignore</option><option value="fail">Count as fail</option><option value="pass">Count as pass</option>
              </select>
            </div>
            <div className="field"><label>Flaky retries</label><input type="number" min="0" max="3" value={config.pass_criteria?.retries ?? 1} onChange={e => updatePassCriteria('retries', Number(e.target.value))} /></div>
          </div>
        </div>
        <div className="sheet-foot">
          <button onClick={onClose} className="editor-action" style={{ height: 28 }}>Cancel</button>
          <button onClick={handleSave} className="editor-action" style={{ height: 28, background: 'var(--text)', color: 'var(--bg)', borderColor: 'var(--text)' }}>
            <I.Check size={12} /> Save changes
          </button>
        </div>
      </div>
    </>
  );
}

/* ──────────────────────────────────────────────────────────────
   Shortcuts overlay
   ────────────────────────────────────────────────────────────── */
function ShortcutsOverlay({ onClose }) {
  const sections = [
    { title: 'General', items: [
      { keys: ['⌘', 'K'], label: 'Open command palette / search everywhere' },
      { keys: ['?'], label: 'Show keyboard shortcuts' },
      { keys: ['esc'], label: 'Close overlay' },
    ]},
    { title: 'Run', items: [
      { keys: ['⌘', '↵'], label: 'Run selected tests' },
      { keys: ['⌘', '.'], label: 'Stop run' },
      { keys: ['R'], label: 'Re-run last' },
    ]},
    { title: 'Tool windows', items: [
      { keys: ['['], label: 'Toggle Test Explorer' },
      { keys: [']'], label: 'Toggle Results' },
      { keys: ['⌘', '\\'], label: 'Maximise editor' },
    ]},
    { title: 'Navigation', items: [
      { keys: ['↑', '↓'], label: 'Navigate test cases' },
      { keys: ['␣'], label: 'Toggle test selection' },
      { keys: ['↵'], label: 'Open active test' },
      { keys: ['⌘', 'W'], label: 'Close current tab' },
    ]},
  ];
  return (
    <div className="cmd-overlay" onClick={onClose}>
      <div className="shortcut-modal" onClick={e => e.stopPropagation()}>
        <h2>Keyboard shortcuts</h2>
        <div className="shortcut-list">
          {sections.map(s => (
            <div key={s.title}>
              <div className="shortcut-section">{s.title}</div>
              {s.items.map(it => (
                <div className="shortcut-row" key={it.label}>
                  <span className="lbl">{it.label}</span>
                  <span className="keys">{it.keys.map((k, i) => <kbd key={i}>{k}</kbd>)}</span>
                </div>
              ))}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}
