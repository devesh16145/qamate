<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Agrim ATS — IDE</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"></div>

  <!-- Vendor libraries -->
  <script src="vendor/react.development.js"></script>
  <script src="vendor/react-dom.development.js"></script>
  <script src="vendor/babel.min.js"></script>
  
  <!-- Icons -->
  <script src="vendor/icons.js"></script>

  <!-- Shared AI Agent UI (same module as the agent window; rendered docked in the right panel) -->
  <script type="text/babel" src="agent_ui.js"></script>

  <!-- React App -->
<script type="text/babel">
const { useState, useEffect, useRef } = React;

function Modals({ isOpen, type, tcId, flowId, description, onClose, onSubmit, toast, reviewData, jiraType }) {
  if (!isOpen) return null;

  if (type === 'jira') {
    return <JiraModal tcId={tcId} flowId={flowId} description={description} initialType={jiraType} onClose={onClose} onSubmit={onSubmit} toast={toast} />;
  }
  if (type === 'record') {
    return <RecordModal tcId={tcId} flowId={flowId} description={description} onClose={onClose} onSubmit={onSubmit} toast={toast} />;
  }
  if (type === 'review') {
    return <ReviewModal tcId={tcId} flowId={flowId} description={description} onClose={onClose} toast={toast} reviewData={reviewData} />;
  }
  if (type === 'coverage') {
    return <CoverageModal tcId={tcId} flowId={flowId} description={description} onClose={onClose} toast={toast} />;
  }
  return null;
}

window.Modals = Modals;

/* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
   RecordModal Setup
   â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
function RecordModal({ tcId, flowId, description, onClose, toast }) {
  const [tc, setTc] = useState(tcId || '');
  const [desc, setDesc] = useState(description || '');
  const [flow, setFlow] = useState(flowId || 'catalog');
  const [platform, setPlatform] = useState('seller');
  const [flowsList, setFlowsList] = useState([]);

  useEffect(() => {
    if (window.ats && window.ats.getFlows) {
      window.ats.getFlows().then(fs => {
        setFlowsList(fs || []);
        if (fs && fs.length && !flowId) {
          setFlow(fs[0].id);
        }
      });
    }
  }, []);

  const handleRecord = async () => {
    toast(`Launching recorder for ${tc}... Close the browser when done.`);
    onClose();

    try {
      const res = await window.ats.recordTest({
        flowId: flow,
        tcId: tc,
        description: desc,
        env: 'dev',
        platform
      });

      if (res.status === 'needs_review') {
        toast(`Recording captured ${res.steps.length} steps. Loading review...`);
        if (window.openReviewTab) {
          window.openReviewTab(res.tc_id, res.flowId, res.description, {
            steps: res.steps,
            assertions: [],
            criteria: [],
            editMode: false
          });
        } else {
          window.setModalState({
            isOpen: true,
            type: 'review',
            tcId: res.tc_id,
            flowId: res.flowId,
            description: res.description,
            reviewData: {
              steps: res.steps,
              assertions: [],
              criteria: [],
              editMode: false
            }
          });
        }
      } else if (res.status === 'success') {
        toast(`Recording saved successfully for ${tc}!`);
        if (window.location) window.location.reload();
      } else {
        toast(`Recording failed: ${res.message || 'unknown error'}`);
      }
    } catch (e) {
      toast(`Recording error: ${e.message}`);
    }
  };

  return (
    <div className="overlay">
      <div className="modal" style={{ width: 450 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
          <h2 style={{ fontSize: 15, margin: 0, color: 'var(--text)', fontWeight: 600 }}>Record New Test</h2>
          <button className="ic" onClick={onClose}><I.X size={16} /></button>
        </div>
        <div className="modal-body" style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          <div className="field">
            <label style={{ fontSize: 11.5 }}>Module / Flow</label>
            <select className="setting-input" value={flow} onChange={e => setFlow(e.target.value)}>
              {flowsList.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
            </select>
          </div>
          <div className="field">
            <label style={{ fontSize: 11.5 }}>Platform</label>
            <select className="setting-input" value={platform} onChange={e => setPlatform(e.target.value)}>
              <option value="seller">Seller App</option>
              <option value="admin">Admin Panel</option>
            </select>
          </div>
          <div className="field">
            <label style={{ fontSize: 11.5 }}>Test Case ID</label>
            <input className="setting-input" value={tc} onChange={e => setTc(e.target.value)} placeholder="e.g. TC-CATALOG-005" />
          </div>
          <div className="field">
            <label style={{ fontSize: 11.5 }}>Description</label>
            <input className="setting-input" value={desc} onChange={e => setDesc(e.target.value)} placeholder="e.g. Verify item request" />
          </div>
        </div>
        <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 20 }}>
          <button className="rv-cta" onClick={onClose}>Cancel</button>
          <button className="rv-cta primary" onClick={handleRecord}>Start Recording</button>
        </div>
      </div>
    </div>
  );
}

/* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
   ReviewModal / Edit Test
   â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
function ReviewModal({ tcId, flowId, description, onClose, toast, reviewData, isTab }) {
  const [preconditions, setPreconditions] = useState('');
  const [expected, setExpected] = useState('');
  const [steps, setSteps] = useState([]);
  const [assertions, setAssertions] = useState([]);
  const [criteria, setCriteria] = useState([]);
  
  // Assertion builder state
  const [showAb, setShowAb] = useState(false);
  const [abAfterStep, setAbAfterStep] = useState(1);
  const [abType, setAbType] = useState('element_visible');
  const [abSelector, setAbSelector] = useState('');
  const [abValue, setAbValue] = useState('');
  const [abDesc, setAbDesc] = useState('');
  const [abCount, setAbCount] = useState(1);
  const [abCountOp, setAbCountOp] = useState('==');
  const [abMs, setAbMs] = useState(2000);

  // Criteria builder state
  const [showCb, setShowCb] = useState(false);
  const [cbType, setCbType] = useState('success_toast');
  const [cbSelector, setCbSelector] = useState('');
  const [cbValue, setCbValue] = useState('');
  const [cbDesc, setCbDesc] = useState('');

  useEffect(() => {
    async function load() {
      if (reviewData && reviewData.steps && reviewData.steps.length > 0) {
        setSteps(reviewData.steps);
        setAssertions(reviewData.assertions || []);
        setCriteria(reviewData.criteria || []);
        setPreconditions(reviewData.preconditions || '');
        setExpected(reviewData.expectedResult || '');
      } else {
        // We are in editMode and need to fetch the existing test case config
        try {
          const flows = await window.ats.getFlows();
          const flow = flows.find(f => f.id === flowId);
          const tc = flow?.test_cases?.find(t => t.tc_id === tcId);
          if (tc) {
            setPreconditions(tc.preconditions || '');
            setExpected(tc.expected_result || '');
            setSteps((tc.checkpoints || []).map((cp, i) => ({
              id: i + 1,
              rawLine: '',
              type: 'other',
              target: '',
              targetDescription: cp,
              value: '',
              varName: '',
            })));
            setAssertions((tc.assertions || []).map((a, i) => ({ ...a, idx: i })));
            setCriteria((tc.criteria || []).map((c, i) => ({ ...c, idx: i })));
          }
        } catch (err) {
          toast(`Failed to load test case: ${err.message}`);
        }
      }
    }
    load();
  }, [tcId, flowId, reviewData]);

  const handleSave = async () => {
    toast('Saving test recording review...');
    const payload = {
      tcId,
      flowId,
      description,
      preconditions,
      expectedResult: expected,
      steps,
      assertions,
      criteria,
      editMode: reviewData?.editMode || false
    };

    try {
      const res = await window.ats.saveRecordingReview(payload);
      if (res.status === 'success') {
        toast(`Recording review saved successfully for ${tcId}!`);
        if (window.location) window.location.reload();
      } else {
        toast(`Failed to save: ${res.message || 'unknown error'}`);
      }
    } catch (err) {
      toast(`Error saving review: ${err.message}`);
    }
    onClose();
  };

  const handleAddScroll = (stepId) => {
    const scrollStep = {
      id: steps.length + 1,
      rawLine: 'page.evaluate("window.scrollBy(0, 500)")',
      type: 'scroll',
      target: '',
      targetDescription: 'Scroll down 500px',
      value: '500',
      varName: '',
    };
    const insertIdx = steps.findIndex(s => s.id === stepId);
    const newSteps = [...steps];
    newSteps.splice(insertIdx + 1, 0, scrollStep);
    newSteps.forEach((s, idx) => s.id = idx + 1);
    setSteps(newSteps);
    toast('Scroll step inserted.');
  };

  const handleDeleteStep = (stepId) => {
    const newSteps = steps.filter(s => s.id !== stepId);
    newSteps.forEach((s, idx) => s.id = idx + 1);
    setSteps(newSteps);
    toast('Step deleted.');
  };

  const handleAddAssertion = () => {
    const assertion = { afterStep: abAfterStep, type: abType, description: abDesc || abType };
    if (abSelector) assertion.selector = abSelector;
    if (abValue) assertion.value = abValue;
    if (abType === 'element_count') { assertion.count = abCount; assertion.operator = abCountOp; }
    if (abType === 'wait_ms') { assertion.value = abMs; }

    setAssertions([...assertions, assertion]);
    setShowAb(false);
    toast(`Assertion added after step ${abAfterStep}`);
  };

  const handleDeleteAssertion = (idx) => {
    setAssertions(assertions.filter((_, i) => i !== idx));
  };

  const handleAddCriteria = () => {
    const criterion = { type: cbType, description: cbDesc || cbType };
    if (cbSelector) criterion.selector = cbSelector;
    if (cbValue) criterion.value = cbValue;

    setCriteria([...criteria, criterion]);
    setShowCb(false);
    toast('Criteria added.');
  };

  const handleDeleteCriteria = (idx) => {
    setCriteria(criteria.filter((_, i) => i !== idx));
  };

  const STEP_ICONS = {
    navigate: '🌐', click: '👉', fill: '✍️',
    type: '⌨️', select: '📋', check: '☑️',
    dblclick: '👉👉', hover: '👇', press: '⌨️',
    wait: '⏳', viewport: '📺', scroll: '⬇️', other: '▶️'
  };

  const innerContent = (
    <>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16, padding: isTab ? '16px 20px 0' : 0 }}>
          <h2 style={{ fontSize: 15, margin: 0, color: 'var(--text)', fontWeight: 600 }}>{reviewData?.editMode ? 'Edit Test' : 'Review Recording'} — {tcId}</h2>
          <button className="ic" onClick={onClose} title={isTab ? 'Close tab' : 'Close'}><I.X size={16} /></button>
        </div>
        
        <div className="modal-body" style={{ display: 'flex', flexDirection: 'column', gap: 14, padding: isTab ? '12px 20px' : undefined }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <div>
              <label style={{ display: 'block', fontSize: 11, marginBottom: 4, color: 'var(--text-3)' }}>Preconditions</label>
              <input className="setting-input" style={{ width: '100%', boxSizing: 'border-box' }} value={preconditions} onChange={e => setPreconditions(e.target.value)} placeholder="e.g. User is logged in, Catalog page loaded" />
            </div>
            <div>
              <label style={{ display: 'block', fontSize: 11, marginBottom: 4, color: 'var(--text-3)' }}>Expected Result</label>
              <input className="setting-input" style={{ width: '100%', boxSizing: 'border-box' }} value={expected} onChange={e => setExpected(e.target.value)} placeholder="e.g. Product saved successfully, toast appears" />
            </div>
          </div>

          <div>
            <div style={{ fontSize: 11.5, fontWeight: 600, marginBottom: 6, color: 'var(--text)' }}>Captured Steps</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 5, maxHeight: 250, overflowY: 'auto', border: '1px solid var(--border)', borderRadius: 4, padding: 8, background: 'var(--surface-1)' }}>
              {steps.length === 0 ? (
                <div style={{ color: 'var(--text-3)', fontSize: 11.5, textAlign: 'center', padding: '16px 0' }}>No steps captured.</div>
              ) : steps.map((s) => {
                const icon = STEP_ICONS[s.type] || STEP_ICONS.other;
                const isInput = s.type === 'fill' || s.type === 'type';
                return (
                  <div key={s.id} style={{ display: 'flex', alignItems: 'center', gap: 8, borderBottom: '1px solid var(--border)', paddingBottom: 6 }}>
                    <div style={{ fontFamily: 'var(--mono)', fontSize: 10, color: 'var(--text-3)', width: 20 }}>{s.id}</div>
                    <div style={{ fontSize: 14 }}>{icon}</div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 12, color: 'var(--text)' }}>{s.targetDescription || s.type}</div>
                      {isInput && (
                        <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginTop: 4 }}>
                          <span style={{ fontSize: 10, color: 'var(--text-3)' }}>Var:</span>
                          <input className="setting-input" style={{ padding: '2px 4px', fontSize: 10, width: 120 }} value={s.varName || ''} onChange={e => {
                            const newSteps = [...steps];
                            const sIdx = newSteps.findIndex(st => st.id === s.id);
                            newSteps[sIdx].varName = e.target.value;
                            setSteps(newSteps);
                          }} placeholder="variableName" />
                          <span style={{ fontSize: 10, color: 'var(--text-3)', textOverflow: 'ellipsis', overflow: 'hidden', whiteSpace: 'nowrap', maxWidth: 180 }}>Value: "{s.value}"</span>
                        </div>
                      )}
                    </div>
                    <button className="rv-cta" style={{ padding: '2px 6px', fontSize: 10 }} onClick={() => handleAddScroll(s.id)}>⬇ Scroll</button>
                    <button className="rv-cta primary" style={{ padding: '2px 6px', fontSize: 10 }} onClick={() => { setAbAfterStep(s.id); setShowAb(true); }}>+ Assert</button>
                    <button className="ic" style={{ color: 'var(--fail)', padding: 0 }} onClick={() => handleDeleteStep(s.id)}><I.X size={12} /></button>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Assertion Builder */}
          {showAb && (
            <div style={{ padding: 12, border: '1px solid var(--border)', borderRadius: 6, background: 'var(--surface-2)' }}>
              <div style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', marginBottom: 8 }}>Add Assertion after Step {abAfterStep}</div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 8 }}>
                <div>
                  <label style={{ display: 'block', fontSize: 10, marginBottom: 2 }}>Type</label>
                  <select className="setting-input" style={{ width: '100%', fontSize: 11 }} value={abType} onChange={e => setAbType(e.target.value)}>
                    <option value="element_visible">Element Visible</option>
                    <option value="element_not_visible">Element Not Visible</option>
                    <option value="element_contains_text">Element Contains Text</option>
                    <option value="element_has_text">Element Has Text</option>
                    <option value="element_has_value">Element Has Value</option>
                    <option value="element_enabled">Element Enabled</option>
                    <option value="element_disabled">Element Disabled</option>
                    <option value="element_count">Element Count</option>
                    <option value="page_contains_text">Page Contains Text</option>
                    <option value="page_not_contains_text">Page Not Contains Text</option>
                    <option value="url_contains">URL Contains</option>
                    <option value="url_equals">URL Equals</option>
                    <option value="title_contains">Title Contains</option>
                    <option value="no_error_toast">No Error Toast</option>
                    <option value="success_toast">Success Toast</option>
                    <option value="toast_contains">Toast Contains Text</option>
                    <option value="wait_ms">Wait (ms)</option>
                  </select>
                </div>
                {['element_visible', 'element_not_visible', 'element_contains_text', 'element_has_text', 'element_has_value', 'element_enabled', 'element_disabled', 'element_count'].includes(abType) && (
                  <div>
                    <label style={{ display: 'block', fontSize: 10, marginBottom: 2 }}>CSS Selector</label>
                    <input className="setting-input" style={{ width: '100%' }} value={abSelector} onChange={e => setAbSelector(e.target.value)} placeholder="e.g. .toast, #submit-btn" />
                  </div>
                )}
                {['element_contains_text', 'element_has_text', 'element_has_value', 'page_contains_text', 'page_not_contains_text', 'url_contains', 'url_equals', 'title_contains', 'toast_contains'].includes(abType) && (
                  <div>
                    <label style={{ display: 'block', fontSize: 10, marginBottom: 2 }}>Expected Value</label>
                    <input className="setting-input" style={{ width: '100%' }} value={abValue} onChange={e => setAbValue(e.target.value)} placeholder="e.g. Basmati Rice" />
                  </div>
                )}
                {abType === 'element_count' && (
                  <div style={{ display: 'flex', gap: 6 }}>
                    <div style={{ flex: 1 }}>
                      <label style={{ display: 'block', fontSize: 10, marginBottom: 2 }}>Op</label>
                      <select className="setting-input" style={{ width: '100%' }} value={abCountOp} onChange={e => setAbCountOp(e.target.value)}>
                        <option value="==">==</option>
                        <option value=">=">&gt;=</option>
                        <option value="<=">&lt;=</option>
                      </select>
                    </div>
                    <div style={{ flex: 1 }}>
                      <label style={{ display: 'block', fontSize: 10, marginBottom: 2 }}>Count</label>
                      <input type="number" className="setting-input" style={{ width: '100%' }} value={abCount} onChange={e => setAbCount(parseInt(e.target.value) || 1)} />
                    </div>
                  </div>
                )}
                {abType === 'wait_ms' && (
                  <div>
                    <label style={{ display: 'block', fontSize: 10, marginBottom: 2 }}>Wait Time (ms)</label>
                    <input type="number" className="setting-input" style={{ width: '100%' }} value={abMs} onChange={e => setAbMs(parseInt(e.target.value) || 2000)} />
                  </div>
                )}
              </div>
              <div style={{ marginBottom: 10 }}>
                <label style={{ display: 'block', fontSize: 10, marginBottom: 2 }}>Description (Comment)</label>
                <input className="setting-input" style={{ width: '100%' }} value={abDesc} onChange={e => setAbDesc(e.target.value)} placeholder="e.g. Basmati basmati product should be in list" />
              </div>
              <div style={{ display: 'flex', gap: 6, justifyContent: 'flex-end' }}>
                <button className="rv-cta" onClick={() => setShowAb(false)}>Cancel</button>
                <button className="rv-cta primary" onClick={handleAddAssertion}>Add Assertion</button>
              </div>
            </div>
          )}

          {/* Assertions List */}
          {assertions.length > 0 && (
            <div>
              <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--text-3)', marginBottom: 6 }}>Assertions</div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                {assertions.map((a, idx) => (
                  <div key={idx} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '3px 8px', border: '1px solid var(--border)', borderRadius: 12, background: 'var(--surface-2)', fontSize: 11 }}>
                    <span style={{ fontWeight: 600, color: 'var(--accent)' }}>#{a.afterStep}</span>
                    <span style={{ color: 'var(--text-2)' }}>{a.type.replace(/_/g, ' ')}</span>
                    <span style={{ color: 'var(--text-3)' }}>{a.selector || a.value}</span>
                    <button className="ic" style={{ padding: 0 }} onClick={() => handleDeleteAssertion(idx)}><I.X size={10} /></button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Criteria Builder */}
          {showCb && (
            <div style={{ padding: 12, border: '1px solid var(--border)', borderRadius: 6, background: 'var(--surface-2)' }}>
              <div style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', marginBottom: 8 }}>Add Success / Failure Criteria</div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 8 }}>
                <div>
                  <label style={{ display: 'block', fontSize: 10, marginBottom: 2 }}>Type</label>
                  <select className="setting-input" style={{ width: '100%', fontSize: 11 }} value={cbType} onChange={e => setCbType(e.target.value)}>
                    <option value="success_toast">Success Toast</option>
                    <option value="no_error_toast">No Error Toast</option>
                    <option value="element_visible">Element Visible</option>
                    <option value="element_not_visible">Element Not Visible</option>
                    <option value="element_contains_text">Element Contains Text</option>
                    <option value="page_contains_text">Page Contains Text</option>
                    <option value="page_not_contains_text">Page Not Contains Text</option>
                    <option value="url_contains">URL Contains</option>
                    <option value="url_equals">URL Equals</option>
                    <option value="title_contains">Title Contains</option>
                    <option value="toast_contains">Toast Contains Text</option>
                  </select>
                </div>
                {['element_visible', 'element_not_visible', 'element_contains_text'].includes(cbType) && (
                  <div>
                    <label style={{ display: 'block', fontSize: 10, marginBottom: 2 }}>CSS Selector</label>
                    <input className="setting-input" style={{ width: '100%' }} value={cbSelector} onChange={e => setCbSelector(e.target.value)} placeholder="e.g. [class*=success]" />
                  </div>
                )}
                {['element_contains_text', 'page_contains_text', 'page_not_contains_text', 'url_contains', 'url_equals', 'title_contains', 'toast_contains'].includes(cbType) && (
                  <div>
                    <label style={{ display: 'block', fontSize: 10, marginBottom: 2 }}>Expected Value</label>
                    <input className="setting-input" style={{ width: '100%' }} value={cbValue} onChange={e => setCbValue(e.target.value)} placeholder="e.g. Order Saved" />
                  </div>
                )}
              </div>
              <div style={{ marginBottom: 10 }}>
                <label style={{ display: 'block', fontSize: 10, marginBottom: 2 }}>Description</label>
                <input className="setting-input" style={{ width: '100%' }} value={cbDesc} onChange={e => setCbDesc(e.target.value)} placeholder="e.g. Success banner appears" />
              </div>
              <div style={{ display: 'flex', gap: 6, justifyContent: 'flex-end' }}>
                <button className="rv-cta" onClick={() => setShowCb(false)}>Cancel</button>
                <button className="rv-cta primary" onClick={handleAddCriteria}>Add Criteria</button>
              </div>
            </div>
          )}

          {/* Criteria List */}
          <div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--text-3)' }}>Success / Failure Criteria (runs at end)</div>
              <button className="rv-cta" style={{ padding: '2px 8px', fontSize: 10 }} onClick={() => setShowCb(true)}>+ Add Criteria</button>
            </div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
              {criteria.map((c, idx) => (
                <div key={idx} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '3px 8px', border: '1px solid var(--border)', borderRadius: 12, background: 'var(--surface-2)', fontSize: 11 }}>
                  <span style={{ fontWeight: 600, color: 'var(--pass)' }}>{c.type.replace(/_/g, ' ')}</span>
                  <span style={{ color: 'var(--text-3)' }}>{c.selector || c.value}</span>
                  <button className="ic" style={{ padding: 0 }} onClick={() => handleDeleteCriteria(idx)}><I.X size={10} /></button>
                </div>
              ))}
            </div>
          </div>
        </div>

        <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 20, padding: isTab ? '0 20px 16px' : 0 }}>
          <button className="rv-cta" onClick={onClose}>{isTab ? 'Close' : 'Cancel'}</button>
          <button className="rv-cta primary" onClick={handleSave}>Save Test</button>
        </div>
    </>
  );

  if (isTab) {
    return <div style={{ height: '100%', overflowY: 'auto' }}>{innerContent}</div>;
  }

  return (
    <div className="overlay">
      <div className="modal" style={{ width: '85%', maxWidth: 880, maxHeight: '90vh', overflowY: 'auto' }}>
        {innerContent}
      </div>
    </div>
  );
}

/* ────────────────────────────────────────────────────────────────────────────────────────────────
   CoverageModal
   ──────────────────────────────────────────────────────────────────────────────────────────────── */
function CoverageModal({ tcId, flowId, description, onClose, toast, isTab }) {
  const [loading, setLoading] = useState(true);
  const [headed, setHeaded] = useState(false);
  const [stopTerminal, setStopTerminal] = useState(true);
  const [variant, setVariant] = useState('');
  const [variantsList, setVariantsList] = useState([]);
  const [analyzing, setAnalyzing] = useState(false);
  const [statusText, setStatusText] = useState('Ready. Click Analyze to run the test and capture the navigation map.');
  const [statusIcon, setStatusIcon] = useState('🔍');
  const [logLines, setLogLines] = useState([]);
  
  const [activeTab, setActiveTab] = useState('navmap'); // navmap | suggestions
  const [navMap, setNavMap] = useState(null);
  const [suggestions, setSuggestions] = useState([]);
  const [summaryGaps, setSummaryGaps] = useState({});
  const [artifactPath, setArtifactPath] = useState('');

  useEffect(() => {
    async function load() {
      try {
        const td = await window.ats.getTcData({ flowId, tcId });
        if (td && td.isVariant && td.variants && Object.keys(td.variants).length > 0) {
          const names = Object.keys(td.variants);
          setVariantsList(names);
          setVariant(names[0]);
        }
      } catch (e) { /* none */ }
      setLoading(false);
    }
    load();
  }, []);

  const runAnalysis = async () => {
    setAnalyzing(true);
    setLogLines([]);
    setArtifactPath('');
    setNavMap(null);
    setSuggestions([]);
    setStatusIcon('⏳');
    setStatusText(`Replaying ${tcId}${variant ? ` [variant: ${variant}]` : ''} — this can take 1–3 minutes…`);

    const unsubProgress = window.ats.onAnalyzeProgress((data) => {
      if (data && data.message) {
        setLogLines(prev => [...prev, data.message]);
      }
    });

    try {
      const res = await window.ats.analyzeCoverage({
        flowId,
        tcId,
        headed,
        stopTerminal,
        variant: variant || null
      });

      if (res.status === 'success') {
        const nm = res.navigation_map || { pages: [], transitions: [] };
        setNavMap(nm);
        setSuggestions(res.suggestions || []);
        setSummaryGaps(res.gaps_summary || {});
        setArtifactPath(res.artifact_file || res.snapshot_file || '');
        setStatusIcon(nm.pages?.length ? '✨' : '✅');
        setStatusText(`Captured ${nm.pages?.length || 0} unique page(s), ${(nm.transitions || []).length} transition(s).`);
        toast('Coverage analysis complete!');
      } else {
        setStatusIcon('❌');
        setStatusText(`Analysis failed: ${res.message || 'Unknown error'}`);
        toast(`Analysis failed: ${res.message}`);
      }
    } catch (e) {
      setStatusIcon('❌');
      setStatusText(`Analysis crashed: ${e.message}`);
      toast(`Crash: ${e.message}`);
    } finally {
      unsubProgress();
      setAnalyzing(false);
    }
  };

  const copyPath = () => {
    if (artifactPath) {
      navigator.clipboard.writeText(artifactPath);
      toast('Path copied to clipboard.');
    }
  };

  const openFolder = () => {
    if (artifactPath) {
      const folder = artifactPath.replace(/[\\\/][^\\\/]+$/, '');
      window.ats.openFolder(folder);
      toast('Artifact folder opened.');
    }
  };

  if (loading) {
    if (isTab) return <div style={{ padding: 40, color: 'var(--text-3)' }}>Loading...</div>;
    return <div className="overlay"><div className="modal">Loading...</div></div>;
  }

  const innerContent = (
    <>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16, padding: isTab ? '16px 20px 0' : 0 }}>
          <h2 style={{ fontSize: 15, margin: 0, color: 'var(--text)', fontWeight: 600 }}>Coverage Analysis — {tcId}</h2>
          <button className="ic" onClick={onClose} title={isTab ? 'Close tab' : 'Close'}><I.X size={16} /></button>
        </div>

        <div className="modal-body" style={{ display: 'flex', flexDirection: 'column', gap: 14, padding: isTab ? '12px 20px' : undefined }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 14px', border: '1px solid var(--border)', borderRadius: 4, background: 'var(--surface-2)' }}>
            <span style={{ fontSize: 16 }}>{statusIcon}</span>
            <span style={{ fontSize: 12, color: 'var(--text-2)' }}>{statusText}</span>
          </div>

          <div style={{ display: 'flex', gap: 14, fontSize: 12, alignItems: 'center', flexWrap: 'wrap' }}>
            {variantsList.length > 0 && (
              <label style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                <strong>Variant:</strong>
                <select className="setting-input" value={variant} onChange={e => setVariant(e.target.value)}>
                  {variantsList.map(v => <option key={v} value={v}>{v}</option>)}
                </select>
              </label>
            )}
            <label style={{ display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}>
              <input type="checkbox" checked={headed} onChange={e => setHeaded(e.target.checked)} /> Show browser (headed)
            </label>
            <label style={{ display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}>
              <input type="checkbox" checked={stopTerminal} onChange={e => setStopTerminal(e.target.checked)} /> Skip final action (safer)
            </label>
          </div>

          <details style={{ cursor: 'pointer' }}>
            <summary style={{ fontSize: 12, color: 'var(--text-3)', padding: '4px 0' }}>Show live execution logs</summary>
            <div style={{ fontFamily: 'var(--mono)', fontSize: 11, padding: '8px 12px', background: '#000', color: '#0f0', borderRadius: 4, maxHeight: 120, overflowY: 'auto', marginTop: 4 }}>
              {logLines.length === 0 ? 'No logs yet.' : logLines.map((l, i) => <div key={i}>{l}</div>)}
            </div>
          </details>

          {artifactPath && (
            <div style={{ padding: '8px 12px', border: '1px solid var(--border)', borderRadius: 4, background: 'var(--surface-2)', fontSize: 11 }}>
              <div style={{ color: 'var(--text-3)', fontWeight: 700, textTransform: 'uppercase', marginBottom: 4 }}>Captured Snapshot Data</div>
              <code style={{ fontSize: 11, wordBreak: 'break-all', display: 'block', marginBottom: 6 }}>{artifactPath}</code>
              <div style={{ display: 'flex', gap: 8 }}>
                <button className="rv-cta" style={{ padding: '3px 8px', fontSize: 10 }} onClick={copyPath}>Copy Path</button>
                <button className="rv-cta" style={{ padding: '3px 8px', fontSize: 10 }} onClick={openFolder}>Open Folder</button>
              </div>
            </div>
          )}

          {Object.keys(summaryGaps).length > 0 && (
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
              {Object.entries(summaryGaps).map(([k, count]) => {
                if (!count) return null;
                return (
                  <div key={k} style={{ padding: '3px 8px', border: '1px solid var(--border)', borderRadius: 12, background: 'var(--surface-2)', fontSize: 11 }}>
                    <strong style={{ color: 'var(--text)' }}>{count}</strong> {k.replace(/_/g, ' ')}
                  </div>
                );
              })}
            </div>
          )}

          <div style={{ display: 'flex', borderBottom: '1px solid var(--border)', gap: 12 }}>
            <button className="coverage-tab-btn" style={{ padding: '6px 12px', borderBottom: activeTab === 'navmap' ? '2px solid var(--accent)' : '2px solid transparent', color: activeTab === 'navmap' ? 'var(--text)' : 'var(--text-2)', background: 'transparent', border: 'none', cursor: 'pointer', fontWeight: 600 }} onClick={() => setActiveTab('navmap')}>Navigation Map</button>
            <button className="coverage-tab-btn" style={{ padding: '6px 12px', borderBottom: activeTab === 'suggestions' ? '2px solid var(--accent)' : '2px solid transparent', color: activeTab === 'suggestions' ? 'var(--text)' : 'var(--text-2)', background: 'transparent', border: 'none', cursor: 'pointer', fontWeight: 600 }} onClick={() => setActiveTab('suggestions')}>Gaps & Suggestions ({suggestions.length})</button>
          </div>

          {activeTab === 'navmap' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {!navMap?.pages?.length ? (
                <div style={{ color: 'var(--text-3)', fontSize: 12, textAlign: 'center', padding: '20px 0' }}>No navigation pages captured yet. Run Analyze to start.</div>
              ) : (
                navMap.pages.map((p, idx) => (
                  <details key={idx} style={{ border: '1px solid var(--border)', borderRadius: 4, background: 'var(--surface-1)' }}>
                    <summary style={{ padding: '10px 12px', cursor: 'pointer', display: 'flex', justifyContent: 'space-between', background: 'var(--surface-2)' }}>
                      <strong>{idx + 1}. {p.title || p.url}</strong>
                      <span style={{ fontSize: 11, color: 'var(--text-3)' }}>{(p.elements || []).length} elements Â· {(p.actions_on_page || []).length} actions</span>
                    </summary>
                    <div style={{ padding: '10px 12px', borderTop: '1px solid var(--border)', display: 'flex', flexDirection: 'column', gap: 6 }}>
                      <div><strong style={{ fontSize: 10, color: 'var(--text-3)' }}>URL:</strong> <code style={{ fontSize: 11 }}>{p.url}</code></div>
                      <div>
                        <strong style={{ fontSize: 10, color: 'var(--text-3)', display: 'block', marginBottom: 4 }}>Elements Inventory:</strong>
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4 }}>
                          {(p.elements || []).map((el, i) => {
                            const label = el.aria_label || el.text || el.placeholder || el.name || el.id || el.tag;
                            return <span key={i} style={{ display: 'inline-block', padding: '2px 6px', background: 'var(--surface-2)', border: '1px solid var(--border)', borderRadius: 8, fontSize: 10 }}>{label}</span>;
                          })}
                        </div>
                      </div>
                    </div>
                  </details>
                ))
              )}
            </div>
          )}

          {activeTab === 'suggestions' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {suggestions.length === 0 ? (
                <div style={{ color: 'var(--text-3)', fontSize: 12, textAlign: 'center', padding: '20px 0' }}>No gaps or coverage suggestions found. Your test coverage is fully complete!</div>
              ) : (
                suggestions.map((s, idx) => (
                  <div key={idx} style={{ padding: '10px 12px', border: '1px solid var(--border)', borderLeft: `3px solid ${s.priority === 'high' ? 'var(--fail)' : s.priority === 'medium' ? 'var(--warn)' : 'var(--text-3)'}`, borderRadius: 4, background: 'var(--surface-1)' }}>
                    <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 4 }}>
                      <span style={{ fontSize: 9, fontWeight: 700, padding: '2px 5px', borderRadius: 3, background: s.priority === 'high' ? 'var(--fail-bg)' : s.priority === 'medium' ? 'var(--warn-bg)' : 'var(--surface-2)', color: s.priority === 'high' ? 'var(--fail)' : s.priority === 'medium' ? 'var(--warn)' : 'var(--text-3)' }}>{s.priority.toUpperCase()}</span>
                      <span style={{ fontSize: 10, textTransform: 'uppercase', color: 'var(--text-3)' }}>{s.type}</span>
                    </div>
                    <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--text)' }}>{s.title}</div>
                    <div style={{ fontSize: 11, color: 'var(--text-2)' }}>{s.description}</div>
                  </div>
                ))
              )}
            </div>
          )}
        </div>

        <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 20, padding: isTab ? '0 20px 16px' : 0 }}>
          <button className="rv-cta" onClick={onClose}>Close</button>
          <button className="rv-cta primary" disabled={analyzing} onClick={runAnalysis}>{analyzing ? 'Analyzing...' : 'Analyze'}</button>
        </div>
    </>
  );

  if (isTab) {
    return <div style={{ height: '100%', overflowY: 'auto' }}>{innerContent}</div>;
  }

  return (
    <div className="overlay">
      <div className="modal" style={{ width: '85%', maxWidth: 900, maxHeight: '90vh', overflowY: 'auto' }}>
        {innerContent}
      </div>
    </div>
  );
}

// Pick screenshots/videos from a test's latest run (+ arbitrary files) to attach to Jira.
function ArtifactPicker({ tcId, selected, onChange }) {
  const [arts, setArts] = useState({ videos: [], screenshots: [] });
  const [extra, setExtra] = useState([]);
  useEffect(() => {
    if (!tcId) return;
    let live = true;
    window.ats.getTcArtifacts({ tcId }).then(r => { if (live) setArts(r || { videos: [], screenshots: [] }); });
    return () => { live = false; };
  }, [tcId]);
  const items = [
    ...(arts.screenshots || []).map(a => ({ ...a, kind: 'img' })),
    ...(arts.videos || []).map(a => ({ ...a, kind: 'vid' })),
    ...extra.map(a => ({ ...a, kind: 'file' })),
  ];
  const sel = selected || [];
  const toggle = (p) => { const s = new Set(sel); s.has(p) ? s.delete(p) : s.add(p); onChange([...s]); };
  const addFiles = async () => {
    const res = await window.ats.pickFiles();
    const metas = (res && res.files) ? res.files : [];
    const added = metas.map(f => (typeof f === 'string' ? f : f.path)).filter(Boolean);
    if (!added.length) return;
    setExtra(e => [...e, ...added.map(p => ({ name: p.split(/[\\/]/).pop(), path: p }))]);
    onChange([...sel, ...added]);
  };
  return (
    <div className="art-picker">
      <div className="art-head">
        <span>Attach{tcId ? ` (${tcId})` : ''}{sel.length ? ` · ${sel.length} selected` : ''}</span>
        <button className="art-add" onClick={addFiles}><I.Upload size={12} /> Add file…</button>
      </div>
      {items.length === 0 ? (
        <div className="art-empty">No screenshots/videos for this test yet — run it, or add a file.</div>
      ) : (
        <div className="art-grid">
          {items.map(a => {
            const on = sel.includes(a.path);
            const Icon = a.kind === 'vid' ? I.Video : a.kind === 'file' ? I.File : I.FileText;
            return (
              <button key={a.path} className={`art-chip${on ? ' on' : ''}`} onClick={() => toggle(a.path)} title={a.name}>
                <Icon size={12} /><span className="nm">{a.name}</span>{on && <I.Check size={11} />}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function JiraModal({ tcId, flowId, description, initialType, isTab, onClose, toast }) {
  const startType = initialType === 'Story' ? 'Story' : 'Bug';
  const prefix = startType === 'Story' ? 'STORY' : 'BUG';
  const bugDesc = `Test Case: ${tcId}\nStatus: FAILED\nEnvironment: Dev\nDetected by: Agrim ATS (automated)\n\n${description ? 'Description: ' + description + '\n\n' : ''}--- Steps to Reproduce ---\n1. Open Agrim ATS\n2. Select test case ${tcId}\n3. Click Run\n4. Observe failure`;
  const storyDesc = `Test Case: ${tcId}\n${description ? 'Summary: ' + description + '\n\n' : ''}--- User Story ---\nAs a <role>\nI want <capability>\nSo that <benefit>\n\n--- Acceptance Criteria ---\n- \n- `;
  const [summary, setSummary] = useState(`${prefix}: ${tcId} - ${description || (startType === 'Story' ? 'New capability' : 'Automated test failure')}`);
  const [desc, setDesc] = useState(startType === 'Story' ? storyDesc : bugDesc);
  const [labels, setLabels] = useState(startType === 'Story' ? 'story, ats' : 'automated-test, ats');
  const [issueType, setIssueType] = useState(startType);
  const [attach, setAttach] = useState([]);
  const [busy, setBusy] = useState(false);

  const buildItem = (status) => ({
    type: issueType === 'Story' ? 'story' : 'bug',
    tcId, flowId, summary, description: desc,
    labels: labels.split(',').map(s => s.trim()).filter(Boolean),
    attachments: attach, status,
  });
  const saveDraft = async () => {
    setBusy(true);
    const res = await window.ats.jiraItemSave(buildItem('draft'));
    setBusy(false);
    if (res && res.success) { window.dispatchEvent(new Event('jira-items-changed')); toast('Saved as draft in Bug & Story Manager'); onClose && onClose(); }
    else toast('Save failed: ' + ((res && res.error) || 'unknown'));
  };
  const submit = async () => {
    setBusy(true);
    toast('Creating Jira issue…');
    const saved = await window.ats.jiraItemSave(buildItem('draft'));
    if (!saved || !saved.success) { setBusy(false); toast('Save failed: ' + ((saved && saved.error) || 'unknown')); return; }
    const raised = await window.ats.jiraItemRaise(saved.item.id);
    setBusy(false);
    if (raised && raised.success) { window.dispatchEvent(new Event('jira-items-changed')); toast(`Created ${raised.key}${raised.attachments ? ` · ${raised.attachments} file(s)` : ''}`); onClose && onClose(); }
    else toast('Jira error: ' + ((raised && raised.error) || 'unknown'));
  };

  const inner = (
    <>
      <div className="field" style={{ display: 'block' }}>
        <label style={{ display: 'block', fontSize: 11, marginBottom: 4, color: 'var(--text-3)' }}>Issue Type</label>
        <select className="setting-input" value={issueType} onChange={e => setIssueType(e.target.value)}>
          <option value="Bug">Bug / Defect</option>
          <option value="Story">Story / Feature</option>
        </select>
      </div>
      <div className="field" style={{ display: 'block' }}>
        <label style={{ display: 'block', fontSize: 11, marginBottom: 4, color: 'var(--text-3)' }}>Summary</label>
        <input className="setting-input" style={{ width: '100%', boxSizing: 'border-box' }} value={summary} onChange={e => setSummary(e.target.value)} />
      </div>
      <div className="field" style={{ display: 'block' }}>
        <label style={{ display: 'block', fontSize: 11, marginBottom: 4, color: 'var(--text-3)' }}>Description</label>
        <textarea className="setting-input" style={{ width: '100%', boxSizing: 'border-box', height: 150, fontFamily: 'var(--mono)', fontSize: 11.5 }} value={desc} onChange={e => setDesc(e.target.value)} />
      </div>
      <div className="field" style={{ display: 'block' }}>
        <label style={{ display: 'block', fontSize: 11, marginBottom: 4, color: 'var(--text-3)' }}>Labels (comma-separated)</label>
        <input className="setting-input" style={{ width: '100%', boxSizing: 'border-box' }} value={labels} onChange={e => setLabels(e.target.value)} />
      </div>
      <ArtifactPicker tcId={tcId} selected={attach} onChange={setAttach} />
    </>
  );
  const actions = (
    <>
      <button className="rv-cta" onClick={onClose} disabled={busy}>Cancel</button>
      <button className="rv-cta" onClick={saveDraft} disabled={busy}>Save as draft</button>
      <button className="rv-cta primary" onClick={submit} disabled={busy}><I.Bug size={13} /> Submit to Jira</button>
    </>
  );

  if (isTab) {
    return (
      <div className="jira-tab">
        <div className="jira-tab-head"><h2><I.Bug size={15} /> Create Jira Issue — <span className="mono">{tcId}</span></h2></div>
        <div className="jira-tab-body">{inner}</div>
        <div className="jira-tab-actions">{actions}</div>
      </div>
    );
  }
  return (
    <div className="overlay">
      <div className="modal" style={{ width: 600 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
          <h2 style={{ fontSize: 15, margin: 0, color: 'var(--text)', fontWeight: 600 }}>Create Jira Issue</h2>
          <button className="ic" onClick={onClose}><I.X size={16} /></button>
        </div>
        <div className="modal-body" style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>{inner}</div>
        <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 20 }}>{actions}</div>
      </div>
    </div>
  );
}

function DataBridge() {

    const [err, setErr] = useState(null);

            try {
                const flows = await window.ats.getFlows();
                const history = await window.ats.getHistory();

                // Bulk-read test_data for every TC in one IPC call so the explorer can show
                // each variant as a second-level row under its parent test case.
                const allItems = [];
                for (const f of flows) for (const tc of f.test_cases) allItems.push({ flowId: f.id, tcId: tc.tc_id });
                const bulk = (allItems.length ? await window.ats.getBulkTcData(allItems) : {}) || {};

                const isVariantShape = (val) => val && typeof val === 'object' && !Array.isArray(val)
                    && Object.keys(val).length > 0
                    && Object.values(val).every(v => v && typeof v === 'object' && !Array.isArray(v));
                const kindOf = (name) => /negative|empty|error|fail|invalid|reject|missing/i.test(name) ? 'negative' : 'positive';

                const iconMap = { 'catalog': 'Box', 'sign_in': 'User', 'po': 'FileText' };
                const mappedModules = flows.map(f => ({
                    id: f.id,
                    name: f.name,
                    icon: iconMap[f.id] || 'Folder',
                    tests: f.test_cases.map(tc => {
                        const tcId = tc.tc_id;
                        const tdata = bulk[tcId];
                        const hasVariants = isVariantShape(tdata);
                        const variantNames = hasVariants ? Object.keys(tdata) : [];
                        return {
                            id: tcId,
                            title: tc.description,
                            pre: tc.preconditions,
                            checkpoints: tc.checkpoints || [],
                            tags: [],
                            hasData: true,
                            datasets: hasVariants ? variantNames : ['default'],
                            lastStatus: 'never',
                            lastDuration: '—',
                            versions: variantNames.map(name => ({
                                id: `${tcId}::${name}`,
                                label: name,
                                kind: kindOf(name),
                                dataset: name,
                                lastStatus: 'never',
                                lastDuration: '—',
                                error: '',
                                tags: [],
                            })),
                        };
                    })
                }));

                // Map history
            const mappedHistory = history.map(h => {
                const parts = (h.id || '').split('_');
                const passedN = h.passed || 0, failedN = h.failed || 0;
                return {
                    id: h.id,
                    when: `${parts[0]} ${(parts[1] || '').replace(/-/g, ':')}`,
                    tcs: h.tc_ids || [],
                    passed: passedN,
                    failed: failedN,
                    skipped: h.skipped || 0,
                    flaky: h.flaky || 0,
                    warnings: h.warnings || 0,
                    // Prefer the numeric duration_s; h.duration is a display string like
                    // "2m 13s" and parseFloat would wrongly yield 2.0s for a 133s run.
                    duration: (typeof h.duration_s === 'number' ? h.duration_s : parseFloat(h.duration)) || 0,
                    // run_metadata.status is "Completed"/"Stopped"; derive pass/fail from counts
                    status: h.status === 'Stopped' ? 'fail' : (failedN > 0 ? 'fail' : (passedN > 0 ? 'pass' : 'fail')),
                    // Authoritative per-test results embedded by the runner (JUnit-derived)
                    results: h.results || null,
                };
            });

            const configObj = await window.ats.getConfig();
            window.MODULES = mappedModules;
            window.HISTORY = mappedHistory.length ? mappedHistory : [{ id: 'empty', when: 'Never', tcs: [], passed: 0, failed: 0, skipped: 0, duration: 0, status: 'pass' }];
            window.TREND = [ { day: 'Today', total: 0, passed: 0, failed: 0 } ]; // stub
            window.USER_STORIES = {};
            window.TEST_STEPS = {};
            
            window.USERS = (configObj?.platforms?.seller?.users || configObj?.users || []).map((u, i) => ({
                id: `seller-${i}`,
                name: u.label || `Seller ${i + 1}`,
                email: u.email || '',
                password: u.password || '',
            }));
            if (window.USERS.length === 0) {
                window.USERS = [{ id: 'seller-0', name: 'Default User', email: '', password: '' }];
            }
            
            window.ADMINS = (configObj?.platforms?.admin?.users || configObj?.admin_users || []).map((u, i) => ({
                id: `admin-${i}`,
                name: u.label || `Admin ${i + 1}`,
                email: u.email || '',
                password: u.password || '',
            }));
            if (window.ADMINS.length === 0) {
                window.ADMINS = [{ id: 'admin-0', name: 'Default Admin', email: '', password: '' }];
            }
            
            setData(true);
        } catch (err) {
            console.error("Failed to load ATS data", err);
            setErr(err.message || String(err));
        }
        }
        load();
    }, []);

    if (err) return <div style={{padding: 40, color: 'red'}}>Error: {err}</div>;
    if (!data) return <div style={{padding: 40, color: '#94a3b8'}}>Loading IDE...</div>;
    return <App />;
}

// Global themed tooltips: converts native `title` attributes app-wide into styled tooltips.
function Tooltips() {
  const [tip, setTip] = useState(null);
  useEffect(() => {
    let timer = null, curEl = null;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(v, hi));
    const show = (el) => {
      const text = el.getAttribute('data-tip');
      if (!text) return;
      const r = el.getBoundingClientRect();
      const below = r.bottom < window.innerHeight - 70;
      setTip({ text, x: clamp(r.left + r.width / 2, 44, window.innerWidth - 44), y: below ? r.bottom + 7 : r.top - 7, above: !below });
    };
    const onOver = (e) => {
      const el = e.target && e.target.closest && e.target.closest('[title],[data-tip]');
      if (!el) return;
      if (el.hasAttribute('title')) { const t = el.getAttribute('title'); if (t) el.setAttribute('data-tip', t); el.removeAttribute('title'); }
      if (!el.getAttribute('data-tip')) return;
      curEl = el;
      clearTimeout(timer);
      timer = setTimeout(() => { if (curEl === el) show(el); }, 350);
    };
    const onOut = (e) => {
      if (!curEl) return;
      if (e.relatedTarget && curEl.contains(e.relatedTarget)) return;
      clearTimeout(timer); setTip(null); curEl = null;
    };
    const hide = () => { clearTimeout(timer); setTip(null); curEl = null; };
    document.addEventListener('pointerover', onOver, true);
    document.addEventListener('pointerout', onOut, true);
    window.addEventListener('scroll', hide, true);
    window.addEventListener('mousedown', hide, true);
    return () => {
      document.removeEventListener('pointerover', onOver, true);
      document.removeEventListener('pointerout', onOut, true);
      window.removeEventListener('scroll', hide, true);
      window.removeEventListener('mousedown', hide, true);
    };
  }, []);
  if (!tip) return null;
  return ReactDOM.createPortal(
    <div className={`tooltip${tip.above ? ' above' : ''}`} style={{ left: tip.x, top: tip.y }}>{tip.text}</div>,
    document.body
  );
}

  // Layout / tool windows
  const [leftCollapsed, setLeftCollapsed] = useState(false);
  const [rightCollapsed, setRightCollapsed] = useState(false);
  // Right rail: agent is the default. History is the secondary inner panel.
  // Both can be visible simultaneously (4-panel layout: left | center | history | agent).
  const [agentDocked,   setAgentDocked]   = useState(true);   // agent in far-right slot
  const [historyDocked, setHistoryDocked] = useState(false);  // history in inner-right slot

  // ── Resizable side panels (drag the gutter; min-width clamped; persisted) ──
  const gridRef = useRef(null);
  const PANEL_MIN = { left: 200, center: 380, right: 280 };
  const PANEL_MAX = 640;
  const [leftW, setLeftW] = useState(() => { const v = +localStorage.getItem('ats.lw'); return v >= PANEL_MIN.left ? v : 260; });
  const [rightW, setRightW] = useState(() => { const v = +localStorage.getItem('ats.rw'); return v >= PANEL_MIN.right ? v : 360; });
  const startResize = (side) => (e) => {
    e.preventDefault();
    const grid = gridRef.current; if (!grid) return;
    const rect = grid.getBoundingClientRect();
    let cur = side === 'left' ? leftW : rightW;
    const otherR = (rightCollapsed && !agentDocked) ? 0 : rightW;
    const otherL = leftCollapsed ? 0 : leftW;
    const onMove = (ev) => {
      if (side === 'left') {
        const maxW = Math.min(PANEL_MAX, rect.width - PANEL_MIN.center - otherR);
        cur = Math.max(PANEL_MIN.left, Math.min(ev.clientX - rect.left, maxW));
        grid.style.setProperty('--lw', cur + 'px');
      } else {
        const maxW = Math.min(PANEL_MAX, rect.width - PANEL_MIN.center - otherL);
        cur = Math.max(PANEL_MIN.right, Math.min(rect.right - ev.clientX, maxW));
        grid.style.setProperty('--rw', cur + 'px');
      }
    };
    const onUp = () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      document.body.classList.remove('resizing');
      if (side === 'left') { setLeftW(cur); localStorage.setItem('ats.lw', Math.round(cur)); }
      else { setRightW(cur); localStorage.setItem('ats.rw', Math.round(cur)); }
    };
    document.body.classList.add('resizing');

  const toggleCheckVersion = (id) => setCheckedVersions(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const selectModule = (mod, on) => setChecked(s => { const n = new Set(s); mod.tests.forEach(t => on ? n.add(t.id) : n.delete(t.id)); return n; });
  const clearChecked = () => { setChecked(new Set()); setCheckedVersions(new Set()); };
  const checkAll = () => setChecked(new Set(MODULES.flatMap(m => m.tests.map(t => t.id))));
  const toggleSection = (id) => setSectionsOpen(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });

  /* ───── Filtered modules ───── */
  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    return MODULES.map(m => {
      const tests = m.tests.filter(t => {
        if (q && !(`${t.id} ${t.title}`.toLowerCase().includes(q))) return false;
        if (filter === 'selected' && !checked.has(t.id)) return false;
        if (filter === 'failing' && t.lastStatus !== 'fail') return false;
        if (filter === 'new' && !(t.tags.includes('new') || t.lastStatus === 'never')) return false;
        if (filter === 'pinned' && !pinned.has(t.id)) return false;
        return true;
      });
      return { ...m, tests };
    }).filter(m => m.tests.length > 0);
  }, [search, filter, checked, pinned]);

  return (
    <div className="app">
      <TitleBar
        theme={theme} setTheme={setTheme}
        onOpenCmd={() => setCmdOpen(true)}
        onOpenSettings={() => setSettingsOpen(true)}
        env={env} setEnv={setEnv}
        leftTool={leftTool} setLeftTool={setLeftTool}
        setLeftCollapsed={setLeftCollapsed}
        leftCollapsed={leftCollapsed}
        rightCollapsed={rightCollapsed}
        setRightCollapsed={setRightCollapsed}
        agentDocked={agentDocked}   setAgentDocked={setAgentDocked}
        historyDocked={historyDocked} setHistoryDocked={setHistoryDocked}
        setActiveTab={setActiveTab}
        openResultsTab={openResultsTab}
        openTab={openTab}
        tabs={tabs}
        toast={toast}
      />
      <div className="main-shell">
        <div ref={gridRef} style={{ '--lw': leftW + 'px', '--rw': rightW + 'px' }}
          className={`main-grid${leftCollapsed ? ' lc' : ''}${(rightCollapsed || (!agentDocked && !historyDocked)) ? ' rc' : ''}${agentDocked && historyDocked ? ' both-docked' : agentDocked ? ' agent-docked' : historyDocked ? ' history-docked' : ''}`}>
          {!leftCollapsed && (
            <LeftToolWindow
              tool={leftTool}
              modules={filtered}
              allCount={totalTests}
              failingCount={failingCount}
              newCount={newCount}
              pinnedCount={pinned.size}
              checked={checked}
              checkedCount={checked.size}
              pinned={pinned}
              activeTcId={activeTcId}
              openTab={openTab}
              runStatus={runStatus}
              openModules={openModules}
              toggleModule={toggleModule}
              toggleCheck={toggleCheck}
              togglePin={togglePin}
              selectModule={selectModule}
              clearChecked={clearChecked}
              checkAll={checkAll}
              search={search} setSearch={setSearch}
              filter={filter} setFilter={setFilter}
              running={running}
              runSingle={runSingle}
              onClose={() => setLeftCollapsed(true)}
              toast={toast}
              onRun={runSelected}
              onStop={stopRun}
              runProgress={runProgress}
              seller={seller} setSeller={setSeller}
              admin={admin} setAdmin={setAdmin}
              execMode={execMode} setExecMode={setExecMode}
              headless={headless} setHeadless={setHeadless}
              browserBackend={browserBackend} toggleBrowserBackend={toggleBrowserBackend}
              expandedTcs={expandedTcs}
              toggleExpandTc={toggleExpandTc}
              checkedVersions={checkedVersions}
              toggleCheckVersion={toggleCheckVersion}
            />
          )}
          <EditorArea
            tabs={tabs} activeTab={activeTab} setActiveTab={setActiveTab}
            closeTab={closeTab} setTabView={setTabView}
            logLines={logLines} running={running}
            execMode={execMode} headless={headless}
            runProgress={runProgress}
            onOpenCmd={() => setCmdOpen(true)}
            onRun={runSelected}
            runSingle={runSingle}
            drawerH={drawerH}
            setDrawerH={setDrawerH}
            onClearLog={() => setLogLines([])}
            openResultsTab={openResultsTab}
            toast={toast}
            checkedCount={checked.size}
            history={HISTORY}
            trend={TREND}
            onCreateBug={(tc) => openJiraTab(tc.id, (tc.module && tc.module.id) || '', tc.title || tc.description || '', 'Bug')}
            openTab={openTab}
            openCoverageTab={openCoverageTab}
            openReviewTab={openReviewTab}
          />
          {/* Inner right panel: History — appears between center and agent */}
          {historyDocked && !rightCollapsed && (
            <HistoryPanel
              history={HISTORY}
              onOpen={openResultsTab}
              onClose={() => setHistoryDocked(false)}
              onPopOut={() => { window.ats.historyOpenWindow(); setHistoryDocked(false); }}
            />
          )}
          {/* Outer right panel: Agent — always the far-right slot */}
          {agentDocked && AgentPanel && !rightCollapsed && (
            <AgentPanel embedded
              onUndock={() => { window.ats.agentOpenWindow(); setAgentDocked(false); }}
              onClose={() => setAgentDocked(false)} />
          )}
          {!leftCollapsed && (
            <div className="resize-h rh-left" style={{ left: 'var(--lw)' }} onMouseDown={startResize('left')} title="Drag to resize"></div>
          )}
          {(agentDocked || historyDocked) && !rightCollapsed && (
            <div className="resize-h rh-right" style={{ right: 'var(--rw)' }} onMouseDown={startResize('right')} title="Drag to resize"></div>
          )}
        </div>
      </div>
      <StatusBar
        activeTc={activeTc}
        env={env}
        execMode={execMode}
        headless={headless}
        running={running}
        runProgress={runProgress}
        checkedCount={checked.size}

      />

      {cmdOpen && <CommandPalette
        onClose={() => setCmdOpen(false)}
        modules={MODULES}
        openTab={openTab}
        runSelected={runSelected}
        setSettingsOpen={setSettingsOpen}
        setShortcutsOpen={setShortcutsOpen}

      />}
      {settingsOpen && <SettingsSheet onClose={() => setSettingsOpen(false)} headless={headless} setHeadless={setHeadless} toast={toast} />}
      {shortcutsOpen && <ShortcutsOverlay onClose={() => setShortcutsOpen(false)} />}

      <div className="toast-stack">
        {toasts.map(t => <div className="toast" key={t.id}>{t.msg}</div>)}
      </div>
      <Tooltips />
    </div>
  );
}

const nowTs = () => {

/* ──────────────────────────────────────────────────────────────

function TitleBar({ theme, setTheme, onOpenCmd, onOpenSettings, env, setEnv, leftTool, setLeftTool, setLeftCollapsed, leftCollapsed, rightCollapsed, setRightCollapsed, agentDocked, setAgentDocked, historyDocked, setHistoryDocked, setActiveTab, openResultsTab, openTab, tabs, toast }) {

    { id: 'history', label: 'History', icon: 'Clock' },
    { id: 'reports', label: 'Reports', icon: 'FileText' },
  ];
  return (
    <div className={`tw-strip ${side}`}>
      <div className="tw-strip-group">
        {tools.map(t => {
          const Icon = I[t.icon] || I.Folder;
          const active = current === t.id && !collapsed;
          return (
            <button key={t.id}
              className={active ? 'active' : ''}
