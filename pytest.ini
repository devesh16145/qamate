[pytest]
testpaths = tests
# Tracing is owned by conftest.py (manage_trace / admin_page fixtures) so traces
# land in results/<timestamp>/traces/<tc_id>.zip with clean TC names, cover the
# admin context too, and show up in run history. Keep pytest-playwright's tracer
# off to avoid a double-start collision. Mode is set via config.json "tracing".
addopts = -v --tb=short --tracing=off --screenshot=only-on-failure
markers =
    tc(id): Associate a test with a Test Case ID
