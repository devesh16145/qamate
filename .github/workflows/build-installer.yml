name: Build Windows Installer

# Builds the QAmate Windows NSIS installer and publishes it to a GitHub Release.
#
# Triggers:
#   - Push a tag like `v1.0.0`  -> builds + attaches the .exe to that release.
#   - Manual "Run workflow"     -> builds + uploads the .exe as a run artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      offline:
        description: "Bundle a Python runtime for offline install"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python (for the bundled runtime staging tooling)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm install

      - name: Generate app icon
        run: npm run icon

      - name: Stage offline Python runtime
        if: ${{ github.event_name == 'push' || inputs.offline }}
        run: npm run prepare:python

      - name: Build installer (electron-builder NSIS)
        run: npm run dist
        env:
          # electron-builder auto-publishes to the release when GH_TOKEN is set
          # and the build was triggered by a tag push.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: QAmate-Setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
