<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="QAmate - Tests that heal themselves">
  <title>QAmate - Tests that heal themselves</title>
  <defs>
    <symbol id="qamate-mark" viewBox="0 0 64 64">
      <g fill="none">
        <rect x="6.5" y="7.5" width="43" height="44" rx="8" fill="#FFFFFF"/>
        <path d="M6.5 18.5 L6.5 15.5 A8 8 0 0 1 14.5 7.5 L41.5 7.5 A8 8 0 0 1 49.5 15.5 L49.5 18.5 Z" fill="#1D4ED8"/>
        <circle cx="12" cy="13" r="1.6" fill="#FFFFFF"/>
        <circle cx="17" cy="13" r="1.6" fill="#FFFFFF"/>
        <circle cx="22" cy="13" r="1.6" fill="#FFFFFF"/>
        <path d="M24 29 L18 35 L24 41" stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M26.7 42 L29.3 28" stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M32 29 L38 35 L32 41" stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="50" cy="50" r="11.25" fill="#FFFFFF"/>
        <circle cx="50" cy="50" r="10" fill="#1D4ED8"/>
        <path d="M45.5 50 L48.5 53 L54.5 46.5" stroke="#FFFFFF" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </symbol>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.55"/>
    </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 90) rotate(120) scale(520)">
      <stop stop-color="#1D4ED8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .disp { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brand lockup -->
  <use href="#qamate-mark" x="90" y="104" width="96" height="96"/>
  <text x="206" y="184" class="disp" font-size="74" font-weight="700" letter-spacing="-0.02em"><tspan fill="#3B82F6">QA</tspan><tspan fill="#F8FAFC">mate</tspan></text>
  <line x1="208" y1="214" x2="230" y2="214" stroke="#334155" stroke-width="1.5"/>
  <text x="242" y="220" class="disp" font-size="19" font-weight="600" letter-spacing="0.24em" fill="#94A3B8">AI E2E TESTING</text>
  <line x1="452" y1="214" x2="474" y2="214" stroke="#334155" stroke-width="1.5"/>

  <!-- Headline -->
  <text x="88" y="330" class="disp" font-size="70" font-weight="700" letter-spacing="-0.02em" fill="#F8FAFC">Tests that heal</text>
  <text x="88" y="408" class="disp" font-size="70" font-weight="700" letter-spacing="-0.02em"><tspan fill="#3B82F6">themselves.</tspan></text>

  <!-- Subline -->
  <text x="90" y="466" class="disp" font-size="24" font-weight="400" fill="#CBD5E1">Self-healing Playwright tests and an AI agent that</text>
  <text x="90" y="500" class="disp" font-size="24" font-weight="400" fill="#CBD5E1">authors and verifies suites in a live browser.</text>

  <!-- Footer chip + repo -->
  <rect x="90" y="540" width="196" height="44" rx="10" fill="#1D4ED8"/>
  <text x="188" y="568" class="disp" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Open Source / MIT</text>
  <text x="306" y="568" class="mono" font-size="16" fill="#64748B">github.com/devesh16145/qamate</text>

  <!-- IDE card -->
  <g transform="translate(724,150)">
    <rect width="392" height="360" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <path d="M0 14 A14 14 0 0 1 14 0 L378 0 A14 14 0 0 1 392 14 L392 40 L0 40 Z" fill="#0B1220"/>
    <circle cx="22" cy="20" r="4.5" fill="#475569"/>
    <circle cx="38" cy="20" r="4.5" fill="#475569"/>
    <circle cx="54" cy="20" r="4.5" fill="#475569"/>
    <text x="196" y="25" class="mono" font-size="12" fill="#64748B" text-anchor="middle">QAmate demo suite</text>

    <!-- sidebar -->
    <rect x="14" y="54" width="112" height="292" rx="8" fill="#0B1220"/>
    <text x="28" y="80" class="mono" font-size="10" letter-spacing="0.12em" fill="#475569">FLOWS</text>
    <text x="28" y="104" class="mono" font-size="12" fill="#22C55E">demo/</text>
    <text x="28" y="126" class="mono" font-size="12" fill="#94A3B8">TC-DEMO-001</text>
    <text x="28" y="148" class="mono" font-size="12" fill="#94A3B8">TC-DEMO-002</text>

    <!-- main -->
    <rect x="138" y="54" width="240" height="150" rx="8" fill="#0B1220"/>
    <rect x="150" y="66" width="70" height="22" rx="5" fill="#1D4ED8" fill-opacity="0.18"/>
    <text x="162" y="81" class="mono" font-size="11" fill="#60A5FA">Agent</text>
    <text x="150" y="114" class="mono" font-size="12" fill="#94A3B8">&gt; observe()</text>
    <text x="150" y="136" class="mono" font-size="12" fill="#94A3B8">&gt; create_test_case</text>
    <text x="150" y="158" class="mono" font-size="12" fill="#22C55E">&gt; run_test_case passed</text>
    <text x="150" y="184" class="mono" font-size="12" fill="#94A3B8">&gt; self-heal: 1 fixed</text>

    <!-- results -->
    <rect x="138" y="216" width="240" height="130" rx="8" fill="#0B1220"/>
    <text x="150" y="240" class="mono" font-size="10" letter-spacing="0.12em" fill="#475569">RESULTS</text>
    <rect x="150" y="252" width="216" height="30" rx="6" fill="#052E16"/>
    <text x="162" y="272" class="mono" font-size="12" fill="#4ADE80">PASSED 2/2 critical_only</text>
    <text x="150" y="306" class="mono" font-size="11" fill="#64748B">Duration 12.4s   Heals 1</text>
    <rect x="150" y="318" width="216" height="5" rx="2.5" fill="#1E293B"/>
    <rect x="150" y="318" width="216" height="5" rx="2.5" fill="#1D4ED8"/>
  </g>
</svg>
