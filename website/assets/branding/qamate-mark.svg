<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="QAmate">
  <title>QAmate</title>
  <!--
    Canonical mark — browser window + </> + pass badge.
    Integer grid on 64 canvas; reuse via <use href="qamate-mark.svg#qamate-mark"/>.
  -->
  <defs>
    <symbol id="qamate-mark" viewBox="0 0 64 64">
      <g id="mark">
        <!-- Blue window chrome (single shell, no seam between title bar and frame) -->
        <path
          fill="#1D4ED8"
          d="M16 8h32a8 8 0 0 1 8 8v32a8 8 0 0 1-8 8H16a8 8 0 0 1-8-8V16a8 8 0 0 1 8-8z"
        />
        <!-- White content panel (flat top, rounded bottom — sits below 11px title bar) -->
        <path
          fill="#FFFFFF"
          d="M9 19h46v32a6 6 0 0 1-6 6H15a6 6 0 0 1-6-6V19z"
        />
        <!-- Window controls -->
        <circle cx="14" cy="14" r="1.5" fill="#FFFFFF"/>
        <circle cx="18" cy="14" r="1.5" fill="#FFFFFF"/>
        <circle cx="22" cy="14" r="1.5" fill="#FFFFFF"/>
        <!-- </> — balanced stroke weight, optically centered in content area -->
        <g fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 34l-4 3.5 4 3.5"/>
          <path d="M27 33l2 8"/>
          <path d="M32 34l4 3.5-4 3.5"/>
        </g>
        <!-- Pass badge — white ring separates from window, check optically centered -->
        <circle cx="49" cy="49" r="10" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.75"/>
        <path
          d="M44.25 49l3 3 7.75-7.75"
          stroke="#FFFFFF"
          stroke-width="2.25"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </g>
    </symbol>
  </defs>
  <use href="#qamate-mark" width="64" height="64"/>
</svg>
