    </symbol>
    <style>
      .qm-word { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; font-size: 38px; font-weight: 700; letter-spacing: -0.02em; }
      .qm-tag  { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.22em; }
