  <line x1="88" y1="63" x2="104" y2="63" stroke="#334155" stroke-width="1"/>
  <text x="112" y="67" class="qm-tag" fill="#94A3B8">AI E2E TESTING</text>
  <line x1="236" y1="63" x2="252" y2="63" stroke="#334155" stroke-width="1"/>
